<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core" xmlns:crud="jakarta.faces.composite/crud" template="./general.xhtml">
    <ui:define name="titulo"> Gestión de Resultados de Examen </ui:define>
    <ui:define name="cuerpo">
        <h:form id="frmTabla">
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Nuevo Resultado" icon="pi pi-plus" actionListener="#{examenResultadoModels.btnNuevoHandler}" update=":frmFormulario @form"/>
                </p:toolbarGroup>
            </p:toolbar>
            <p:dataTable id="tablaRegistros" value="#{examenResultadoModels.registros}" var="r" emptyMessage="No se encontraron registros" paginator="true" rows="10" style="margin-top: 10px;" selectionMode="single" selection="#{examenResultadoModels.registro}" rowKey="#{r.idExamenResultado}">
                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>
                <p:ajax event="rowDblselect" listener="#{examenResultadoModels.btnSeleccionarRegistro(examenResultadoModels.registro.idExamenResultado)}" update=":frmFormulario"/>
                <p:column headerText="ID">
                    <h:outputText value="#{r.idExamenResultado}"/>
                </p:column>
                <p:column headerText="Paciente / Persona">
                    <h:outputText value="#{r.idOrdenExamen.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.nombres} #{r.idOrdenExamen.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.apellidos}"/>
                </p:column>
                <p:column headerText="Fecha creación">
                    <h:outputText value="#{r.fechaCreacion}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Resultado">
                    <h:outputText value="#{r.resultado}"/>
                </p:column>
                <p:column headerText="Interpretación">
                    <h:outputText value="#{r.interpretacion}"/>
                </p:column>
                <p:column headerText="Ruta atestado">
                    <h:outputText value="#{r.rutaAtestado}"/>
                </p:column>
                <f:facet name="footer">
                    <p:commandButton id="btnModificar" value="Modificar" icon="pi pi-pencil" actionListener="#{examenResultadoModels.btnSeleccionarRegistro(examenResultadoModels.registro.idExamenResultado)}" update=":frmFormulario" disabled="#{empty examenResultadoModels.registro.idExamenResultado}" styleClass="ui-button-warning" style="margin-right: 5px;"/>
                    <p:commandButton id="btnEliminar" value="Eliminar" icon="pi pi-trash" actionListener="#{examenResultadoModels.btnEliminarHandler(examenResultadoModels.registro.idExamenResultado)}" update=":mensajesGlobales:growl-sticky @form" disabled="#{empty examenResultadoModels.registro.idExamenResultado}" styleClass="ui-button-danger">
                        <p:confirm header="Confirmación" message="¿Estás seguro de eliminar este registro?" icon="pi pi-info-circle"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>
        <h:form id="frmFormulario">
            <p:panel header="#{examenResultadoModels.estado == 'CREAR' ? 'Nuevo Registro' : 'Editar Registro'}" rendered="#{examenResultadoModels.estado != 'NINGUNO'}" style="margin-top: 20px;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="ID (Autogenerado):" rendered="#{examenResultadoModels.estado == 'CREAR'}"/>
                    <h:outputText value="#{examenResultadoModels.registro.idExamenResultado}" rendered="#{examenResultadoModels.estado == 'CREAR'}"/>
                    <p:outputLabel for="cmbOrdenExamen" value="Orden de examen:"/>
                    <p:selectOneMenu id="cmbOrdenExamen" value="#{examenResultadoModels.registro.idOrdenExamen}" converter="ordenExamenConverter" required="true" requiredMessage="Seleccione la orden de examen" filter="true" filterMatchMode="contains">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{ordenExamenModels.registros}" var="oe" itemLabel="#{oe.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.nombres} #{oe.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.apellidos} - orden #{oe.idOrdenExamen.toString().substring(0,8)}" itemValue="#{oe}"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="calFechaCreacion" value="Fecha creación:"/>
                    <p:datePicker id="calFechaCreacion" value="#{examenResultadoModels.registro.fechaCreacion}" showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"/>
                    <p:outputLabel for="txtResultado" value="Resultado:"/>
                    <p:inputTextarea id="txtResultado" value="#{examenResultadoModels.registro.resultado}" rows="3" required="true" requiredMessage="El resultado es obligatorio"/>
                    <p:outputLabel for="txtInterpretacion" value="Interpretación:"/>
                    <p:inputTextarea id="txtInterpretacion" value="#{examenResultadoModels.registro.interpretacion}" rows="3"/>
                    <p:outputLabel for="txtRutaAtestado" value="Ruta atestado:"/>
                    <p:inputText id="txtRutaAtestado" value="#{examenResultadoModels.registro.rutaAtestado}"/>
                </h:panelGrid>
                <f:facet name="footer">
                    <crud:botonesCrud modelo="#{examenResultadoModels}" update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>
                </f:facet>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
