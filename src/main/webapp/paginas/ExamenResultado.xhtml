<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['resultado.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <h:form id="frmTabla">

            <p:toolbar>
                <p:toolbarGroup>

                    <p:commandButton
                        value="#{msg['resultado.btn_nuevo']}"
                        icon="pi pi-plus"
                        actionListener="#{examenResultadoModels.btnNuevoHandler}"
                        update=":frmFormulario @form"/>

                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable
                id="tablaRegistros"
                value="#{examenResultadoModels.registros}"
                var="r"
                emptyMessage="#{msg['resultado.msg_vacio']}"
                paginator="true"
                rows="10"
                style="margin-top: 10px;"
                selectionMode="single"
                selection="#{examenResultadoModels.registro}"
                rowKey="#{r.idExamenResultado}">

                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>

                <p:ajax
                    event="rowDblselect"
                    listener="#{examenResultadoModels.btnSeleccionarRegistro(examenResultadoModels.registro.idExamenResultado)}"
                    update=":frmFormulario"/>

                <p:column headerText="#{msg['global.id']}">
                    <h:outputText value="#{r.idExamenResultado}"/>
                </p:column>

                <p:column headerText="#{msg['resultado.col_orden_examen']}">
                    <h:outputText
                        value="#{r.idOrdenExamen.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.nombres} #{r.idOrdenExamen.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.apellidos}"/>
                </p:column>

                <p:column headerText="#{msg['resultado.col_fecha_creacion']}">
                    <h:outputText value="#{r.fechaCreacion}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy HH:mm"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg['resultado.col_resultado']}">
                    <h:outputText value="#{r.resultado}"/>
                </p:column>

                <p:column headerText="#{msg['resultado.col_interpretacion']}">
                    <h:outputText value="#{r.interpretacion}"/>
                </p:column>

                <p:column headerText="#{msg['resultado.col_ruta_atestado']}">
                    <h:outputText value="#{r.rutaAtestado}"/>
                </p:column>

                <f:facet name="footer">

                    <p:commandButton
                        id="btnModificar"
                        value="#{msg['resultado.btn_modificar']}"
                        icon="pi pi-pencil"
                        actionListener="#{examenResultadoModels.btnSeleccionarRegistro(examenResultadoModels.registro.idExamenResultado)}"
                        update=":frmFormulario"
                        disabled="#{empty examenResultadoModels.registro.idExamenResultado}"
                        styleClass="ui-button-warning"
                        style="margin-right: 5px;"/>

                    <p:commandButton
                        id="btnEliminar"
                        value="#{msg['global.eliminar']}"
                        icon="pi pi-trash"
                        actionListener="#{examenResultadoModels.btnEliminarHandler(examenResultadoModels.registro.idExamenResultado)}"
                        update=":mensajesGlobales:growl-sticky @form"
                        disabled="#{empty examenResultadoModels.registro.idExamenResultado}"
                        styleClass="ui-button-danger">

                        <p:confirm
                            header="#{msg['global.confirmacion']}"
                            message="#{msg['resultado.msg_eliminar']}"
                            icon="pi pi-info-circle"/>

                    </p:commandButton>

                </f:facet>

            </p:dataTable>

            <p:confirmDialog
                global="true"
                showEffect="fade"
                hideEffect="fade"
                responsive="true"
                width="350">

                <p:commandButton
                    value="#{msg['global.no']}"
                    type="button"
                    styleClass="ui-confirmdialog-no ui-button-flat"/>

                <p:commandButton
                    value="#{msg['global.si']}"
                    type="button"
                    styleClass="ui-confirmdialog-yes"/>

            </p:confirmDialog>

        </h:form>


        <h:form id="frmFormulario">

            <p:panel
                header="#{examenResultadoModels.estado == 'CREAR' ? msg['resultado.modal_crear'] : msg['resultado.modal_config']}"
                rendered="#{examenResultadoModels.estado != 'NINGUNO'}"
                style="margin-top: 20px;">

                <h:panelGrid columns="2" cellpadding="5">

                    <p:outputLabel
                        value="#{msg['global.codigo_id']}"
                        rendered="#{examenResultadoModels.estado == 'CREAR'}"/>

                    <h:outputText
                        value="#{examenResultadoModels.registro.idExamenResultado}"
                        rendered="#{examenResultadoModels.estado == 'CREAR'}"/>

                    <p:outputLabel
                        for="cmbOrdenExamen"
                        value="#{msg['resultado.lbl_orden_examen']}"/>

                    <p:selectOneMenu
                        id="cmbOrdenExamen"
                        value="#{examenResultadoModels.registro.idOrdenExamen}"
                        converter="ordenExamenConverter"
                        required="true"
                        requiredMessage="#{msg['resultado.msg_req_orden_examen']}"
                        filter="true"
                        filterMatchMode="contains">

                        <f:selectItem
                            itemLabel="#{msg['resultado.sel_orden_examen']}"
                            itemValue="#{null}"
                            noSelectionOption="true"/>

                        <f:selectItems
                            value="#{ordenExamenModels.registros}"
                            var="oe"
                            itemLabel="#{oe.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.nombres} #{oe.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.apellidos} - orden #{oe.idOrdenExamen.toString().substring(0,8)}"
                            itemValue="#{oe}"/>

                    </p:selectOneMenu>

                    <p:outputLabel
                        for="calFechaCreacion"
                        value="#{msg['resultado.lbl_fecha_creacion']}"/>

                    <p:datePicker
                        id="calFechaCreacion"
                        value="#{examenResultadoModels.registro.fechaCreacion}"
                        showTime="true"
                        pattern="dd/MM/yyyy HH:mm"
                        showIcon="true"/>

                    <p:outputLabel
                        for="txtResultado"
                        value="#{msg['resultado.lbl_resultado']}"/>

                    <p:inputTextarea
                        id="txtResultado"
                        value="#{examenResultadoModels.registro.resultado}"
                        rows="3"
                        required="true"
                        requiredMessage="#{msg['resultado.msg_req_resultado']}"/>

                    <p:outputLabel
                        for="txtInterpretacion"
                        value="#{msg['resultado.lbl_interpretacion']}"/>

                    <p:inputTextarea
                        id="txtInterpretacion"
                        value="#{examenResultadoModels.registro.interpretacion}"
                        rows="3"/>

                    <p:outputLabel
                        for="txtRutaAtestado"
                        value="#{msg['resultado.lbl_ruta_atestado']}"/>

                    <p:inputText
                        id="txtRutaAtestado"
                        value="#{examenResultadoModels.registro.rutaAtestado}"/>

                </h:panelGrid>

                <f:facet name="footer">
                    <crud:botonesCrud
                        modelo="#{examenResultadoModels}"
                        update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>
                </f:facet>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>
