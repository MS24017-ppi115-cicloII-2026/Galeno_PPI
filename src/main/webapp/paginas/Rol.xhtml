<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['rol.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <h:form id="frmTabla">

            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton
                        value="#{msg['rol.btn_nuevo']}"
                        icon="pi pi-plus"
                        actionListener="#{rolModel.btnNuevoHandler}"
                        update=":frmFormulario @form"/>
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable
                id="tablaRegistros"
                value="#{rolModel.registros}"
                var="r"
                emptyMessage="#{msg['rol.msg_vacio']}"
                paginator="true"
                rows="10"
                style="margin-top: 10px;"
                selectionMode="single"
                selection="#{rolModel.registro}"
                rowKey="#{r.idRol}">

                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>

                <p:ajax
                    event="rowDblselect"
                    listener="#{rolModel.btnSeleccionarRegistro(rolModel.registro.idRol)}"
                    update=":frmFormulario"/>

                <p:column headerText="#{msg['global.id']}">
                    <h:outputText value="#{r.idRol}"/>
                </p:column>

                <p:column headerText="#{msg['rol.col_nombre']}">
                    <h:outputText value="#{r.nombre}"/>
                </p:column>

                <p:column headerText="#{msg['rol.col_activo']}">
                    <h:outputText value="#{r.activo ? 'Sí' : 'No'}"/>
                </p:column>

                <p:column headerText="#{msg['rol.col_observaciones']}">
                    <h:outputText value="#{r.observaciones}"/>
                </p:column>

                <f:facet name="footer">

                    <p:commandButton
                        id="btnModificar"
                        value="#{msg['rol.btn_modificar']}"
                        icon="pi pi-pencil"
                        actionListener="#{rolModel.btnSeleccionarRegistro(rolModel.registro.idRol)}"
                        update=":frmFormulario"
                        disabled="#{empty rolModel.registro.idRol}"
                        styleClass="ui-button-warning"
                        style="margin-right: 5px;"/>

                    <p:commandButton
                        id="btnEliminar"
                        value="#{msg['global.eliminar']}"
                        icon="pi pi-trash"
                        actionListener="#{rolModel.btnEliminarHandler(rolModel.registro.idRol)}"
                        update=":mensajesGlobales:growl-sticky @form"
                        disabled="#{empty rolModel.registro.idRol}"
                        styleClass="ui-button-danger">

                        <p:confirm
                            header="#{msg['global.confirmacion']}"
                            message="#{msg['rol.msg_eliminar']}"
                            icon="pi pi-info-circle"/>

                    </p:commandButton>

                </f:facet>

            </p:dataTable>

            <p:confirmDialog
                global="true"
                showEffect="fade"
                hideEffect="fade"
                responsive="true"
                width="350">

                <p:commandButton
                    value="#{msg['global.no']}"
                    type="button"
                    styleClass="ui-confirmdialog-no ui-button-flat"/>

                <p:commandButton
                    value="#{msg['global.si']}"
                    type="button"
                    styleClass="ui-confirmdialog-yes"/>

            </p:confirmDialog>

        </h:form>


        <h:form id="frmFormulario">

            <p:panel
                header="#{rolModel.estado == 'CREAR' ? msg['rol.modal_crear'] : msg['rol.modal_config']}"
                rendered="#{rolModel.estado != 'NINGUNO'}"
                style="margin-top: 20px;">

                <h:panelGrid columns="2" cellpadding="5">

                    <p:outputLabel
                        value="#{msg['global.codigo_id']}"
                        rendered="#{rolModel.estado == 'CREAR'}"/>

                    <h:outputText
                        value="#{rolModel.registro.idRol}"
                        rendered="#{rolModel.estado == 'CREAR'}"/>


                    <p:outputLabel
                        for="txtNombre"
                        value="#{msg['rol.lbl_nombre']}"/>

                    <p:inputText
                        id="txtNombre"
                        value="#{rolModel.registro.nombre}"
                        required="true"
                        requiredMessage="#{msg['rol.msg_req_nombre']}"
                        maxlength="155"/>


                    <p:outputLabel
                        for="chkActivo"
                        value="#{msg['rol.lbl_activo']}"/>

                    <p:selectBooleanCheckbox
                        id="chkActivo"
                        value="#{rolModel.registro.activo}"/>


                    <p:outputLabel
                        for="txtObservaciones"
                        value="#{msg['rol.lbl_observaciones']}"/>

                    <p:inputTextarea
                        id="txtObservaciones"
                        value="#{rolModel.registro.observaciones}"
                        rows="4"
                        maxlength="500"
                        autoResize="false"/>

                </h:panelGrid>

                <f:facet name="footer">

                    <crud:botonesCrud
                        modelo="#{rolModel}"
                        update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>

                </f:facet>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>
