<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['ppe.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <!-- ======================================================= -->
        <!-- TABLA PRINCIPAL                                         -->
        <!-- ======================================================= -->
        <h:form id="frmTabla">
            <div class="ui-g">
                <div class="ui-g-12">
                    <p:toolbar style="margin-bottom: 15px; border-radius: 8px;">
                        <p:toolbarGroup>
                            <p:commandButton value="#{msg['ppe.btn_nuevo']}" icon="pi pi-plus"
                                             actionListener="#{procedimientoPasoExamenModels.btnNuevoHandler}"
                                             update=":frmProcedimientoPasoExamen" oncomplete="PF('dlgProcedimientoPasoExamen').show()"
                                             styleClass="ui-button-success" />
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaRegistros" value="#{procedimientoPasoExamenModels.registros}" var="r"
                                 emptyMessage="#{msg['ppe.msg_vacio']}" paginator="true" rows="10"
                                 selectionMode="single" selection="#{procedimientoPasoExamenModels.registro}" 
                                 rowKey="#{r.idProcedimientoPasoExamen}"
                                 stripedRows="true" style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                        <p:ajax event="rowSelect" update="@form" />
                        <p:ajax event="rowUnselect" update="@form" />
                        <p:ajax event="rowDblselect" listener="#{procedimientoPasoExamenModels.btnSeleccionarRegistro(procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen)}" 
                                update=":frmProcedimientoPasoExamen" oncomplete="PF('dlgProcedimientoPasoExamen').show()" />

                        <p:column headerText="#{msg['global.codigo_id']}" width="18%">
                            <h:outputText value="#{r.idProcedimientoPasoExamen}" style="font-family: monospace; color: gray;" />
                        </p:column>

                        <p:column headerText="#{msg['ppe.col_examen']}">
                            <h:outputText value="#{r.idExamen.nombre}" style="font-weight: bold;" />
                        </p:column>

                        <p:column headerText="#{msg['ppe.col_paso']}">
                            <h:outputText value="#{r.idProcedimientoPaso.nombre}" />
                        </p:column>

                        <p:column headerText="#{msg['global.estado']}" width="12%" style="text-align: center;">
                            <h:outputText value="#{msg['global.activo']}" rendered="#{r.activo}" styleClass="badge badge-activo" />
                            <h:outputText value="#{msg['global.inactivo']}" rendered="#{not r.activo}" styleClass="badge badge-inactivo" />
                        </p:column>

                        <p:column headerText="#{msg['ppe.col_fecha']}" width="18%">
                            <h:outputText value="#{r.fechaCreacion}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="#{msg['global.observaciones']}">
                            <h:outputText value="#{r.observaciones}" />
                        </p:column>

                        <f:facet name="footer">
                            <div class="acciones-tabla">
                                <p:commandButton id="btnModificar" value="#{msg['ppe.btn_modificar']}" icon="pi pi-cog"
                                                 actionListener="#{procedimientoPasoExamenModels.btnSeleccionarRegistro(procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen)}"
                                                 update=":frmProcedimientoPasoExamen" oncomplete="PF('dlgProcedimientoPasoExamen').show()"
                                                 disabled="#{empty procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen}"
                                                 styleClass="ui-button-primary" />

                                <p:commandButton id="btnEliminar" value="#{msg['global.eliminar']}" icon="pi pi-trash"
                                                 actionListener="#{procedimientoPasoExamenModels.btnEliminarHandler(procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen)}"
                                                 update="frmTabla:tablaRegistros :mensajesGlobales:growl-sticky @form"
                                                 disabled="#{empty procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen}"
                                                 styleClass="ui-button-danger ui-button-outlined">
                                    <p:confirm header="#{msg['global.confirmacion']}" message="#{msg['ppe.msg_eliminar']}" icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
                <p:commandButton value="#{msg['global.cancelar']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['global.si_eliminar']}" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>

        <!-- ======================================================= -->
        <!-- DIÁLOGO MODAL PRINCIPAL                                 -->
        <!-- ======================================================= -->
        <p:dialog header="#{procedimientoPasoExamenModels.estado == 'CREAR' ? msg['ppe.modal_crear'] : msg['ppe.modal_config']}" 
                  widgetVar="dlgProcedimientoPasoExamen" modal="true" resizable="false" width="650" 
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            
            <h:form id="frmProcedimientoPasoExamen">
                <p:outputPanel rendered="#{procedimientoPasoExamenModels.registro != null}">
                    
                    <h:outputText value="#{msg['ppe.ayuda_info']}" styleClass="texto-ayuda" style="margin-bottom: 20px; display: block;"/>
                    
                    <div class="ui-fluid ui-g">
                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="cmbExamen" value="#{msg['ppe.lbl_examen']}" />
                            <p:selectOneMenu id="cmbExamen" value="#{procedimientoPasoExamenModels.registro.idExamen}"
                                             converter="examenConverter" required="true" requiredMessage="#{msg['ppe.msg_req_examen']}">
                                <f:selectItem itemLabel="#{msg['ppe.sel_examen']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoExamenModels.examenes}" var="ex" itemValue="#{ex}" itemLabel="#{ex.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="cmbProcedimientoPaso" value="#{msg['ppe.lbl_paso']}" />
                            <p:selectOneMenu id="cmbProcedimientoPaso" value="#{procedimientoPasoExamenModels.registro.idProcedimientoPaso}"
                                             converter="procedimientoPasoConverter" required="true" requiredMessage="#{msg['ppe.msg_req_paso']}">
                                <f:selectItem itemLabel="#{msg['ppe.sel_paso']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoModels.registros}" var="pp" itemValue="#{pp}" itemLabel="#{pp.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="ui-g-12 ui-md-4 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                            <div class="ui-inputgroup">
                                <span style="margin-right: 10px;">#{msg['ppe.lbl_activo']}</span>
                                <p:toggleSwitch id="chkActivo" value="#{procedimientoPasoExamenModels.registro.activo}" />
                            </div>
                        </div>

                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="txtObservaciones" value="#{msg['global.observaciones']}" />
                            <p:inputTextarea id="txtObservaciones" value="#{procedimientoPasoExamenModels.registro.observaciones}" rows="3" placeholder="Detalles de la asignación..." />
                        </div>
                    </div>
                    
                    <p:divider />
                    
                    <!-- BOTONES DE CONTROL CON CIERRE AUTOMÁTICO -->
                    <div style="text-align: right; padding-top: 10px;">
                        <p:commandButton value="#{msg['global.guardar']}" icon="pi pi-save"
                                         actionListener="#{procedimientoPasoExamenModels.btnCrearhandler}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgProcedimientoPasoExamen').hide()"
                                         rendered="#{procedimientoPasoExamenModels.estado == 'CREAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />

                        <p:commandButton value="#{msg['global.actualizar']}" icon="pi pi-refresh"
                                         actionListener="#{procedimientoPasoExamenModels.btnModificarHandler()}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgProcedimientoPasoExamen').hide()"
                                         rendered="#{procedimientoPasoExamenModels.estado == 'MODIFICAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />
                                         
                        <p:commandButton value="#{msg['global.cancelar']}" icon="pi pi-times"
                                         actionListener="#{procedimientoPasoExamenModels.btnCancelar}"
                                         update=":frmTabla"
                                         oncomplete="PF('dlgProcedimientoPasoExamen').hide()"
                                         styleClass="ui-button-secondary ui-button-flat" immediate="true" />
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
