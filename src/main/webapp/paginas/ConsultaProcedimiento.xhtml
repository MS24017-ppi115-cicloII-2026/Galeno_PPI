<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core" xmlns:crud="jakarta.faces.composite/crud" template="./general.xhtml">
    <ui:define name="titulo"> Gestión de Procedimientos de Consulta </ui:define>
    <ui:define name="cuerpo">
        <h:form id="frmTabla">
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Nuevo Procedimiento de Consulta" icon="pi pi-plus" actionListener="#{consultaProcedimientoModels.btnNuevoHandler}" update=":frmFormulario @form"/>
                </p:toolbarGroup>
            </p:toolbar>
            <p:dataTable id="tablaRegistros" value="#{consultaProcedimientoModels.registros}" var="r" emptyMessage="No se encontraron registros" paginator="true" rows="10" style="margin-top: 10px;" selectionMode="single" selection="#{consultaProcedimientoModels.registro}" rowKey="#{r.idConsultaProcedimiento}">
                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>
                <p:ajax event="rowDblselect" listener="#{consultaProcedimientoModels.btnSeleccionarRegistro(consultaProcedimientoModels.registro.idConsultaProcedimiento)}" update=":frmFormulario"/>
                <p:column headerText="ID">
                    <h:outputText value="#{r.idConsultaProcedimiento}"/>
                </p:column>
                <p:column headerText="Paciente / Persona">
                    <h:outputText value="#{r.idConsulta.idPersonaRol.idPersona.nombres} #{r.idConsulta.idPersonaRol.idPersona.apellidos}"/>
                </p:column>
                <p:column headerText="Procedimiento (id)">
                    <h:outputText value="#{r.idProcedimiento}"/>
                </p:column>
                <p:column headerText="Fecha inicio">
                    <h:outputText value="#{r.fechaInicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Fecha fin">
                    <h:outputText value="#{r.fechaFin}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Observaciones">
                    <h:outputText value="#{r.observaciones}"/>
                </p:column>
                <f:facet name="footer">
                    <p:commandButton id="btnModificar" value="Modificar" icon="pi pi-pencil" actionListener="#{consultaProcedimientoModels.btnSeleccionarRegistro(consultaProcedimientoModels.registro.idConsultaProcedimiento)}" update=":frmFormulario" disabled="#{empty consultaProcedimientoModels.registro.idConsultaProcedimiento}" styleClass="ui-button-warning" style="margin-right: 5px;"/>
                    <p:commandButton id="btnEliminar" value="Eliminar" icon="pi pi-trash" actionListener="#{consultaProcedimientoModels.btnEliminarHandler(consultaProcedimientoModels.registro.idConsultaProcedimiento)}" update=":mensajesGlobales:growl-sticky @form" disabled="#{empty consultaProcedimientoModels.registro.idConsultaProcedimiento}" styleClass="ui-button-danger">
                        <p:confirm header="Confirmación" message="¿Estás seguro de eliminar este registro?" icon="pi pi-info-circle"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>
        <h:form id="frmFormulario">
            <p:panel header="#{consultaProcedimientoModels.estado == 'CREAR' ? 'Nuevo Registro' : 'Editar Registro'}" rendered="#{consultaProcedimientoModels.estado != 'NINGUNO'}" style="margin-top: 20px;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="ID (Autogenerado):" rendered="#{consultaProcedimientoModels.estado == 'CREAR'}"/>
                    <h:outputText value="#{consultaProcedimientoModels.registro.idConsultaProcedimiento}" rendered="#{consultaProcedimientoModels.estado == 'CREAR'}"/>
                    <p:outputLabel for="cmbConsulta" value="Consulta:"/>
                    <p:selectOneMenu id="cmbConsulta" value="#{consultaProcedimientoModels.registro.idConsulta}" converter="consultaConverter" required="true" requiredMessage="Seleccione la consulta" filter="true" filterMatchMode="contains">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{consultaModels.registros}" var="c" itemLabel="#{c.idPersonaRol.idPersona.nombres} #{c.idPersonaRol.idPersona.apellidos} - #{c.idConsulta.toString().substring(0,8)}" itemValue="#{c}"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="cmbProcedimiento" value="Procedimiento:"/>
                    <p:selectOneMenu id="cmbProcedimiento" value="#{consultaProcedimientoModels.registro.idProcedimiento}" required="true" requiredMessage="Seleccione el procedimiento" filter="true" filterMatchMode="contains">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{procedimientoModels.registros}" var="pro" itemLabel="#{pro.nombre}" itemValue="#{pro.idProcedimiento}"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="calFechaInicio" value="Fecha inicio:"/>
                    <p:datePicker id="calFechaInicio" value="#{consultaProcedimientoModels.registro.fechaInicio}" showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"/>
                    <p:outputLabel for="calFechaFin" value="Fecha fin:"/>
                    <p:datePicker id="calFechaFin" value="#{consultaProcedimientoModels.registro.fechaFin}" showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"/>
                    <p:outputLabel for="txtObservaciones" value="Observaciones:"/>
                    <p:inputTextarea id="txtObservaciones" value="#{consultaProcedimientoModels.registro.observaciones}" rows="3"/>
                </h:panelGrid>
                <f:facet name="footer">
                    <crud:botonesCrud modelo="#{consultaProcedimientoModels}" update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>
                </f:facet>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
