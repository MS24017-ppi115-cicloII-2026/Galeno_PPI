<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['paso.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <!-- ======================================================= -->
        <!-- TABLA PRINCIPAL                                         -->
        <!-- ======================================================= -->
        <h:form id="frmTabla">
            <div class="ui-g">
                <div class="ui-g-12">
                    <p:toolbar style="margin-bottom: 15px; border-radius: 8px;">
                        <p:toolbarGroup>
                            <p:commandButton value="#{msg['paso.btn_nuevo']}" icon="pi pi-plus"
                                             actionListener="#{procedimientoPasoModels.btnNuevoHandler}"
                                             update=":frmProcedimientoPaso" oncomplete="PF('dlgProcedimientoPaso').show()"
                                             styleClass="ui-button-success" />
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaRegistros" value="#{procedimientoPasoModels.registros}" var="r"
                                 emptyMessage="#{msg['paso.msg_vacio']}" paginator="true" rows="10"
                                 selectionMode="single" selection="#{procedimientoPasoModels.registro}" 
                                 rowKey="#{r.idProcedimientoPaso}"
                                 stripedRows="true" style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                        <p:ajax event="rowSelect" update="@form" />
                        <p:ajax event="rowUnselect" update="@form" />
                        <p:ajax event="rowDblselect" listener="#{procedimientoPasoModels.btnSeleccionarRegistro(procedimientoPasoModels.registro.idProcedimientoPaso)}" 
                                update=":frmProcedimientoPaso" oncomplete="PF('dlgProcedimientoPaso').show()" />

                        <p:column headerText="#{msg['global.codigo_id']}" width="20%">
                            <h:outputText value="#{r.idProcedimientoPaso}" style="font-family: monospace; color: gray;" />
                        </p:column>

                        <p:column headerText="#{msg['paso.col_nombre']}">
                            <h:outputText value="#{r.nombre}" style="font-weight: bold;" />
                        </p:column>

                        <p:column headerText="#{msg['paso.col_procedimiento']}">
                            <h:outputText value="#{r.idProcedimiento.nombre}" />
                        </p:column>

                        <p:column headerText="#{msg['paso.col_rol']}">
                            <h:outputText value="#{r.idRol.nombre}" styleClass="badge badge-info" />
                        </p:column>

                        <p:column headerText="#{msg['paso.col_fin']}" width="15%" style="text-align: center;">
                            <h:outputText value="#{msg['global.si']}" rendered="#{r.indicaFin}" styleClass="badge badge-activo" />
                            <h:outputText value="#{msg['global.no']}" rendered="#{not r.indicaFin}" styleClass="badge badge-inactivo" />
                        </p:column>

                        <f:facet name="footer">
                            <div class="acciones-tabla">
                                <p:commandButton id="btnModificar" value="#{msg['paso.btn_modificar']}" icon="pi pi-cog"
                                                 actionListener="#{procedimientoPasoModels.btnSeleccionarRegistro(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                                 update=":frmProcedimientoPaso" oncomplete="PF('dlgProcedimientoPaso').show()"
                                                 disabled="#{empty procedimientoPasoModels.registro.idProcedimientoPaso}"
                                                 styleClass="ui-button-primary" />

                                <p:commandButton id="btnEliminar" value="#{msg['global.eliminar']}" icon="pi pi-trash"
                                                 actionListener="#{procedimientoPasoModels.btnEliminarHandler(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                                 update="frmTabla:tablaRegistros :mensajesGlobales:growl-sticky @form"
                                                 disabled="#{empty procedimientoPasoModels.registro.idProcedimientoPaso}"
                                                 styleClass="ui-button-danger ui-button-outlined">
                                    <p:confirm header="#{msg['global.confirmacion']}" message="#{msg['paso.msg_eliminar']}" icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
                <p:commandButton value="#{msg['global.cancelar']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['global.si_eliminar']}" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>

        <!-- ======================================================= -->
        <!-- DIÁLOGO MODAL PRINCIPAL                                 -->
        <!-- ======================================================= -->
        <p:dialog header="#{procedimientoPasoModels.estado == 'CREAR' ? msg['paso.modal_crear'] : msg['paso.modal_config']}" 
                  widgetVar="dlgProcedimientoPaso" modal="true" resizable="false" width="650" 
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            
            <h:form id="frmProcedimientoPaso">
                <p:outputPanel rendered="#{procedimientoPasoModels.registro != null}">
                    
                    <h:outputText value="#{msg['paso.ayuda_info']}" styleClass="texto-ayuda" style="margin-bottom: 20px; display: block;"/>
                    
                    <div class="ui-fluid ui-g">
                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="txtNombre" value="#{msg['paso.lbl_nombre']}" />
                            <p:inputText id="txtNombre" value="#{procedimientoPasoModels.registro.nombre}"
                                         required="true" requiredMessage="#{msg['paso.msg_req_nombre']}" maxlength="255" placeholder="Ej. Evaluación inicial" />
                        </div>

                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="cmbProcedimiento" value="#{msg['paso.lbl_proc']}" />
                            <p:selectOneMenu id="cmbProcedimiento" value="#{procedimientoPasoModels.registro.idProcedimiento}"
                                             converter="procedimientoConverter" required="true" requiredMessage="#{msg['paso.msg_req_proc']}">
                                <f:selectItem itemLabel="#{msg['paso.sel_proc']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoModels.procedimientos}" var="pr" itemValue="#{pr}" itemLabel="#{pr.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="ui-g-12 ui-md-8 campo-formulario">
                            <p:outputLabel for="cmbRol" value="#{msg['paso.lbl_rol']}" />
                            <p:selectOneMenu id="cmbRol" value="#{procedimientoPasoModels.registro.idRol}"
                                             converter="rolConverter" required="true" requiredMessage="#{msg['paso.msg_req_rol']}">
                                <f:selectItem itemLabel="#{msg['paso.sel_rol']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoModels.roles}" var="rl" itemValue="#{rl}" itemLabel="#{rl.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="ui-g-12 ui-md-4 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                            <div class="ui-inputgroup">
                                <span style="margin-right: 10px;">#{msg['paso.lbl_indica_fin']}</span>
                                <p:toggleSwitch id="chkIndicaFin" value="#{procedimientoPasoModels.registro.indicaFin}" />
                            </div>
                        </div>
                    </div>
                    
                    <p:divider />
                    
                    <!-- BOTONES DE CONTROL CON CIERRE AUTOMÁTICO -->
                    <div style="text-align: right; padding-top: 10px;">
                        <p:commandButton value="#{msg['global.guardar']}" icon="pi pi-save"
                                         actionListener="#{procedimientoPasoModels.btnCrearhandler}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgProcedimientoPaso').hide()"
                                         rendered="#{procedimientoPasoModels.estado == 'CREAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />

                        <p:commandButton value="#{msg['global.actualizar']}" icon="pi pi-refresh"
                                         actionListener="#{procedimientoPasoModels.btnModificarHandler()}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgProcedimientoPaso').hide()"
                                         rendered="#{procedimientoPasoModels.estado == 'MODIFICAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />
                                         
                        <p:commandButton value="#{msg['global.cancelar']}" icon="pi pi-times"
                                         actionListener="#{procedimientoPasoModels.btnCancelar}"
                                         update=":frmTabla"
                                         oncomplete="PF('dlgProcedimientoPaso').hide()"
                                         styleClass="ui-button-secondary ui-button-flat" immediate="true" />
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
