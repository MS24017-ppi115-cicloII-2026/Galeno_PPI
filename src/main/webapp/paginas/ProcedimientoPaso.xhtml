<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">
        Gestión de Pasos de Procedimiento
    </ui:define>

    <ui:define name="cuerpo">

        <h:form id="frmTabla">
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Nuevo Paso" icon="pi pi-plus"
                                     actionListener="#{procedimientoPasoModels.btnNuevoHandler}"
                                     update=":frmFormulario @form"
                                     rendered="#{procedimientoPasoModels.estado == 'NINGUNO'}" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="tablaRegistros" value="#{procedimientoPasoModels.registros}" var="r"
                         emptyMessage="No se encontraron pasos" paginator="true" rows="10"
                         style="margin-top: 10px;"
                         selectionMode="single" selection="#{procedimientoPasoModels.registro}" rowKey="#{r.idProcedimientoPaso}">

                <p:ajax event="rowSelect" update="@form" />
                <p:ajax event="rowUnselect" update="@form" />
                <p:ajax event="rowDblselect" listener="#{procedimientoPasoModels.btnSeleccionarRegistro(procedimientoPasoModels.registro.idProcedimientoPaso)}" update=":frmFormulario" />

                <p:column headerText="ID">
                    <h:outputText value="#{r.idProcedimientoPaso}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{r.nombre}" />
                </p:column>

                <p:column headerText="Procedimiento">
                    <h:outputText value="#{r.idProcedimiento.nombre}" />
                </p:column>

                <p:column headerText="Rol">
                    <h:outputText value="#{r.idRol.nombre}" />
                </p:column>

                <p:column headerText="¿Indica fin?">
                    <h:outputText value="#{r.indicaFin ? 'Sí' : 'No'}" />
                </p:column>

                <f:facet name="footer">
                    <p:commandButton id="btnModificar" value="Modificar" icon="pi pi-pencil"
                                     actionListener="#{procedimientoPasoModels.btnSeleccionarRegistro(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                     update=":frmFormulario"
                                     disabled="#{empty procedimientoPasoModels.registro.idProcedimientoPaso}"
                                     styleClass="ui-button-warning" style="margin-right: 5px;" />

                    <p:commandButton id="btnEliminar" value="Eliminar" icon="pi pi-trash"
                                     actionListener="#{procedimientoPasoModels.btnEliminarHandler(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                     update="frmTabla:tablaRegistros :mensajesGlobales:growl-sticky @form"
                                     disabled="#{empty procedimientoPasoModels.registro.idProcedimientoPaso}"
                                     styleClass="ui-button-danger">
                        <p:confirm header="Confirmación" message="¿Estás seguro de eliminar este paso?" icon="pi pi-info-circle"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes" />
            </p:confirmDialog>
        </h:form>

        <h:form id="frmFormulario">
            <p:panel header="#{procedimientoPasoModels.estado == 'CREAR' ? 'Nuevo Paso' : 'Editar Paso'}"
                     rendered="#{procedimientoPasoModels.estado != 'NINGUNO'}"
                     style="margin-top: 20px;">

                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="ID (Autogenerado):" rendered="#{procedimientoPasoModels.estado == 'CREAR'}"/>
                    <h:outputText value="#{procedimientoPasoModels.registro.idProcedimientoPaso}" rendered="#{procedimientoPasoModels.estado == 'CREAR'}"/>

                    <p:outputLabel for="txtNombre" value="Nombre:" />
                    <p:inputText id="txtNombre" value="#{procedimientoPasoModels.registro.nombre}"
                                 required="true" requiredMessage="El nombre del paso es obligatorio" maxlength="255" />

                    <p:outputLabel for="cmbProcedimiento" value="Procedimiento:" />
                    <p:selectOneMenu id="cmbProcedimiento" value="#{procedimientoPasoModels.registro.idProcedimiento}"
                                     converter="procedimientoConverter" required="true" requiredMessage="El procedimiento es obligatorio">
                        <f:selectItem itemLabel="Seleccione un procedimiento" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{procedimientoPasoModels.procedimientos}" var="pr" itemValue="#{pr}" itemLabel="#{pr.nombre}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="cmbRol" value="Rol:" />
                    <p:selectOneMenu id="cmbRol" value="#{procedimientoPasoModels.registro.idRol}"
                                     converter="rolConverter" required="true" requiredMessage="El rol es obligatorio">
                        <f:selectItem itemLabel="Seleccione un rol" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{procedimientoPasoModels.roles}" var="rl" itemValue="#{rl}" itemLabel="#{rl.nombre}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="chkIndicaFin" value="¿Indica fin del procedimiento?:" />
                    <p:selectBooleanCheckbox id="chkIndicaFin" value="#{procedimientoPasoModels.registro.indicaFin}" />
                </h:panelGrid>

                <f:facet name="footer">
                    <crud:botonesCrud modelo="#{procedimientoPasoModels}" update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>
                </f:facet>
            </p:panel>
        </h:form>

    </ui:define>
</ui:composition>
