<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">
        Gestión de Exámenes Médicos
    </ui:define>

    <ui:define name="cuerpo">

        <!-- ======================================================= -->
        <!-- TABLA MAESTRA: LISTADO DE EXÁMENES                      -->
        <!-- ======================================================= -->
        <h:form id="frmTabla">
            <div class="ui-g">
                <div class="ui-g-12">
                    <p:toolbar style="margin-bottom: 15px; border-radius: 8px;">
                        <p:toolbarGroup>
                            <p:commandButton value="Nuevo Examen" icon="pi pi-plus"
                                             actionListener="#{examenModels.btnNuevoHandler}"
                                             update=":frmExamen" oncomplete="PF('dlgExamen').show()"
                                             styleClass="ui-button-success" />
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaRegistros" value="#{examenModels.registros}" var="r"
                                 emptyMessage="No se encontraron exámenes registrados en el sistema."
                                 paginator="true" rows="10" selectionMode="single"
                                 selection="#{examenModels.registro}" rowKey="#{r.idExamen}"
                                 stripedRows="true" style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                        <p:ajax event="rowSelect" update="@form" />
                        <p:ajax event="rowUnselect" update="@form" />
                        <p:ajax event="rowDblselect" listener="#{examenModels.btnSeleccionarRegistro(examenModels.registro.idExamen)}"
                                update=":frmExamen" oncomplete="PF('dlgExamen').show()" />

                        <p:column headerText="Código ID" width="25%">
                            <h:outputText value="#{r.idExamen}" style="font-family: monospace; color: gray;" />
                        </p:column>

                        <p:column headerText="Nombre del Examen">
                            <h:outputText value="#{r.nombre}" style="font-weight: bold;" />
                        </p:column>

                        <p:column headerText="Estado" width="15%" style="text-align: center;">
                            <h:outputText value="Activo" rendered="#{r.activo}" styleClass="badge badge-activo" />
                            <h:outputText value="Inactivo" rendered="#{not r.activo}" styleClass="badge badge-inactivo" />
                        </p:column>

                        <f:facet name="footer">
                            <div class="acciones-tabla">
                                <p:commandButton id="btnModificar" value="Configurar Examen" icon="pi pi-cog"
                                                 actionListener="#{examenModels.btnSeleccionarRegistro(examenModels.registro.idExamen)}"
                                                 update=":frmExamen" oncomplete="PF('dlgExamen').show()"
                                                 disabled="#{empty examenModels.registro.idExamen}"
                                                 styleClass="ui-button-primary" />

                                <p:commandButton id="btnEliminar" value="Eliminar" icon="pi pi-trash"
                                                 actionListener="#{examenModels.btnEliminarHandler(examenModels.registro.idExamen)}"
                                                 update="frmTabla:tablaRegistros :mensajesGlobales:growl-sticky @form"
                                                 disabled="#{empty examenModels.registro.idExamen}"
                                                 styleClass="ui-button-danger ui-button-outlined">
                                    <p:confirm header="Confirmación Crítica" message="¿Eliminar este examen por completo?" icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
                <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí, Eliminar" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/>
            </p:confirmDialog>
        </h:form>

        <!-- ======================================================= -->
        <!-- DIÁLOGO PRINCIPAL MAESTRO (EXAMEN)                      -->
        <!-- ======================================================= -->
        <p:dialog header="#{examenModels.estado == 'CREAR' ? '✨ Crear Nuevo Examen' : '⚙️ Configuración del Examen'}"
                  widgetVar="dlgExamen" modal="true" resizable="false" width="800" height="450"
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            
            <h:form id="frmExamen">
                <p:messages id="mensajesInternos" showDetail="true" closable="true">
                    <p:autoUpdate />
                </p:messages>

                <p:outputPanel rendered="#{examenModels.registro != null}">
                    <p:tabView id="tabVExamen">

                        <p:tab title="1. Información General">
                            <h:outputText value="Defina los datos principales del examen clínico." styleClass="texto-ayuda"/>

                            <div class="ui-fluid ui-g">
                                <div class="ui-g-12 ui-md-8 campo-formulario">
                                    <p:outputLabel for="txtNombre" value="Nombre del Examen:" />
                                    <p:inputText id="txtNombre" value="#{examenModels.registro.nombre}" required="true" placeholder="Ej. Hemograma Completo" maxlength="255" />
                                </div>

                                <div class="ui-g-12 ui-md-4 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                                    <div class="ui-inputgroup">
                                        <div class="ui-inputgroup-addon"><i class="pi pi-power-off"></i></div>
                                        <span style="margin-left: 10px; margin-right: 10px;">¿Activo?</span>
                                        <p:toggleSwitch id="chkActivo" value="#{examenModels.registro.activo}" />
                                    </div>
                                </div>

                                <div class="ui-g-12 campo-formulario">
                                    <p:outputLabel for="txtObservaciones" value="Observaciones Adicionales:" />
                                    <p:inputTextarea id="txtObservaciones" value="#{examenModels.registro.observaciones}" rows="3" placeholder="Requisitos previos, ayuno necesario..." />
                                </div>
                            </div>
                        </p:tab>

                        <p:tab title="2. Tipos de Examen Asociados" disabled="#{examenModels.estado == 'CREAR'}">
                            <h:outputText value="Vincule a qué categoría o tipo pertenece este examen. Seleccione una fila para editarla o eliminarla." styleClass="texto-ayuda"/>

                            <p:toolbar style="margin-bottom: 10px;">
                                <p:toolbarGroup>
                                    <p:commandButton value="Vincular Tipo de Examen" icon="pi pi-link"
                                                     actionListener="#{examenTipoExamenModels.prepararNuevoParaExamen(examenModels.registro.idExamen)}"
                                                     oncomplete="PF('dlgTipoExamen').show()" update=":frmDialogoTipo" 
                                                     styleClass="ui-button-info" />
                                </p:toolbarGroup>
                            </p:toolbar>

                            <!-- SELECCIÓN Y BOTONES ABAJO -->
                            <p:dataTable id="dtTipos" value="#{examenTipoExamenModels.getRegistrosPorExamen(examenModels.registro.idExamen)}"
                                         var="et" emptyMessage="No hay tipos vinculados a este examen." size="small" stripedRows="true"
                                         selectionMode="single" selection="#{examenTipoExamenModels.registro}" rowKey="#{et.idExamenTipoExamen}">

                                <p:ajax event="rowSelect" update="dtTipos" />
                                <p:ajax event="rowUnselect" update="dtTipos" />
                                <p:ajax event="rowDblselect" listener="#{examenTipoExamenModels.btnSeleccionarRegistro(examenTipoExamenModels.registro.idExamenTipoExamen)}"
                                        update=":frmDialogoTipo" oncomplete="PF('dlgTipoExamen').show()" />

                                <p:column headerText="Categoría / Tipo">
                                    <h:outputText value="#{et.idTipoExamen.nombre}" style="font-weight: 500;" />
                                </p:column>

                                <p:column headerText="Observación del Vínculo">
                                    <h:outputText value="#{et.observaciones}" />
                                </p:column>

                                <f:facet name="footer">
                                    <p:commandButton icon="pi pi-pencil" value="Editar Vínculo"
                                                     styleClass="ui-button-warning"
                                                     actionListener="#{examenTipoExamenModels.btnSeleccionarRegistro(examenTipoExamenModels.registro.idExamenTipoExamen)}"
                                                     update=":frmDialogoTipo" oncomplete="PF('dlgTipoExamen').show()" 
                                                     disabled="#{empty examenTipoExamenModels.registro.idExamenTipoExamen}"/>

                                    <p:commandButton icon="pi pi-unlink" value="Desvincular"
                                                     styleClass="ui-button-danger ui-button-outlined"
                                                     actionListener="#{examenTipoExamenModels.btnEliminarHandler(examenTipoExamenModels.registro.idExamenTipoExamen)}"
                                                     update="dtTipos :mensajesGlobales:growl-sticky"
                                                     disabled="#{empty examenTipoExamenModels.registro.idExamenTipoExamen}">
                                        <p:confirm header="Confirmación" message="¿Desvincular este tipo de examen?" icon="pi pi-exclamation-triangle"/>
                                    </p:commandButton>
                                </f:facet>
                            </p:dataTable>
                        </p:tab>

                    </p:tabView>

                    <p:divider />
                    <div style="text-align: right; padding-top: 10px;">
                        <crud:botonesCrud modelo="#{examenModels}" update=":frmTabla :frmExamen :mensajesGlobales:growl-sticky"/>
                    </div>

                </p:outputPanel>
            </h:form>
        </p:dialog>

        <!-- ======================================================= -->
        <!-- MODAL SECUNDARIO: VINCULAR TIPO DE EXAMEN               -->
        <!-- ======================================================= -->
        <p:dialog header="🔗 Vínculo de Tipo de Examen" widgetVar="dlgTipoExamen" modal="true" resizable="false" 
                  width="500" dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">

            <h:form id="frmDialogoTipo">
                <p:outputPanel rendered="#{examenTipoExamenModels.registro != null}">
                    
                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="cmbTipoExamen" value="Seleccione el Tipo:" />
                        <p:selectOneMenu id="cmbTipoExamen" value="#{examenTipoExamenModels.registro.idTipoExamen}"
                                         converter="tipoExamenConverter" required="true" requiredMessage="Debe seleccionar un tipo.">
                            <f:selectItem itemLabel="Buscar tipo..." itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{examenTipoExamenModels.tiposExamen}" var="te" itemValue="#{te}" itemLabel="#{te.nombre}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="txtObsVinculo" value="Observación de este vínculo:" />
                        <p:inputTextarea id="txtObsVinculo" value="#{examenTipoExamenModels.registro.observaciones}" rows="3" placeholder="Anotaciones exclusivas de esta relación..." />
                    </div>

                    <p:divider />
                    <div style="text-align: right; margin-top: 10px;">
                        <p:commandButton value="Crear Vínculo" icon="pi pi-save"
                                         rendered="#{examenTipoExamenModels.estado == 'CREAR'}"
                                         actionListener="#{examenTipoExamenModels.btnCrearhandler}"
                                         update=":frmExamen:tabVExamen:dtTipos :frmDialogoTipo :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgTipoExamen').hide()" 
                                         styleClass="ui-button-success" />

                        <p:commandButton value="Actualizar Vínculo" icon="pi pi-refresh"
                                         rendered="#{examenTipoExamenModels.estado == 'MODIFICAR'}"
                                         actionListener="#{examenTipoExamenModels.btnModificarHandler()}"
                                         update=":frmExamen:tabVExamen:dtTipos :frmDialogoTipo :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgTipoExamen').hide()" 
                                         styleClass="ui-button-success" />
                    </div>

                </p:outputPanel>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
