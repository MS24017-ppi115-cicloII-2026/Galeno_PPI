<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['exam.titulo']}</ui:define>

    <ui:define name="cuerpo">
        <h:form id="frmTabla">
            <div class="ui-g">
                <div class="ui-g-12">
                    <p:toolbar style="margin-bottom: 15px; border-radius: 8px;">
                        <p:toolbarGroup>
                            <p:commandButton value="#{msg['exam.btn_nuevo']}" icon="pi pi-plus"
                                             actionListener="#{examenModels.btnNuevoHandler}"
                                             update=":frmExamen" oncomplete="PF('dlgExamen').show()"
                                             styleClass="ui-button-success" />
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaRegistros" value="#{examenModels.registros}" var="r"
                                 emptyMessage="#{msg['exam.msg_vacio']}"
                                 paginator="true" rows="10" selectionMode="single"
                                 selection="#{examenModels.registro}" rowKey="#{r.idExamen}"
                                 stripedRows="true" style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                        <p:ajax event="rowSelect" update="@form" />
                        <p:ajax event="rowUnselect" update="@form" />
                        <p:ajax event="rowDblselect" listener="#{examenModels.btnSeleccionarRegistro(examenModels.registro.idExamen)}"
                                update=":frmExamen" oncomplete="PF('dlgExamen').show()" />

                        <p:column headerText="#{msg['global.codigo_id']}" width="25%">
                            <h:outputText value="#{r.idExamen}" style="font-family: monospace; color: gray;" />
                        </p:column>

                        <p:column headerText="#{msg['exam.col_nombre']}">
                            <h:outputText value="#{r.nombre}" style="font-weight: bold;" />
                        </p:column>

                        <p:column headerText="#{msg['global.estado']}" width="15%" style="text-align: center;">
                            <h:outputText value="#{msg['global.activo']}" rendered="#{r.activo}" styleClass="badge badge-activo" />
                            <h:outputText value="#{msg['global.inactivo']}" rendered="#{not r.activo}" styleClass="badge badge-inactivo" />
                        </p:column>

                        <f:facet name="footer">
                            <div class="acciones-tabla">
                                <p:commandButton id="btnModificar" value="#{msg['exam.btn_config']}" icon="pi pi-cog"
                                                 actionListener="#{examenModels.btnSeleccionarRegistro(examenModels.registro.idExamen)}"
                                                 update=":frmExamen" oncomplete="PF('dlgExamen').show()"
                                                 disabled="#{empty examenModels.registro.idExamen}"
                                                 styleClass="ui-button-primary" />

                                <p:commandButton id="btnEliminar" value="#{msg['global.eliminar']}" icon="pi pi-trash"
                                                 actionListener="#{examenModels.btnEliminarHandler(examenModels.registro.idExamen)}"
                                                 update="frmTabla:tablaRegistros :mensajesGlobales:growl-sticky @form"
                                                 disabled="#{empty examenModels.registro.idExamen}"
                                                 styleClass="ui-button-danger ui-button-outlined">
                                    <p:confirm header="#{msg['global.confirmacion_critica']}" message="#{msg['exam.msg_eliminar']}" icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
                <p:commandButton value="#{msg['global.cancelar']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['global.si_eliminar']}" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/>
            </p:confirmDialog>
        </h:form>

        <p:dialog header="#{examenModels.estado == 'CREAR' ? msg['exam.modal_crear'] : msg['exam.modal_config']}"
                  widgetVar="dlgExamen" modal="true" resizable="false" width="800" height="450"
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            
            <h:form id="frmExamen">
                <p:outputPanel rendered="#{examenModels.registro != null}">
                    <p:tabView id="tabVExamen">

                        <p:tab title="#{msg['exam.tab_info']}">
                            <h:outputText value="#{msg['exam.ayuda_info']}" styleClass="texto-ayuda"/>

                            <div class="ui-fluid ui-g">
                                <div class="ui-g-12 ui-md-8 campo-formulario">
                                    <p:outputLabel for="txtNombre" value="#{msg['exam.lbl_nombre']}" />
                                    <p:inputText id="txtNombre" value="#{examenModels.registro.nombre}" required="true" requiredMessage="#{msg['exam.msg_req_nombre']}" placeholder="#{msg['exam.ph_nombre']}" maxlength="255" />
                                </div>

                                <div class="ui-g-12 ui-md-4 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                                    <div class="ui-inputgroup">
                                        <div class="ui-inputgroup-addon"><i class="pi pi-power-off"></i></div>
                                        <span style="margin-left: 10px; margin-right: 10px;">#{msg['global.es_activo']}</span>
                                        <p:toggleSwitch id="chkActivo" value="#{examenModels.registro.activo}" />
                                    </div>
                                </div>

                                <div class="ui-g-12 campo-formulario">
                                    <p:outputLabel for="txtObservaciones" value="#{msg['global.observaciones_adicionales']}" />
                                    <p:inputTextarea id="txtObservaciones" value="#{examenModels.registro.observaciones}" rows="3" placeholder="#{msg['exam.ph_obs']}" />
                                </div>
                            </div>
                        </p:tab>

                        <p:tab title="#{msg['exam.tab_tipos']}" disabled="#{examenModels.estado == 'CREAR'}">
                            <h:outputText value="#{msg['exam.ayuda_tipos']}" styleClass="texto-ayuda"/>

                            <p:toolbar style="margin-bottom: 10px;">
                                <p:toolbarGroup>
                                    <p:commandButton value="#{msg['exam.btn_vincular']}" icon="pi pi-link"
                                                     actionListener="#{examenTipoExamenModels.prepararNuevoParaExamen(examenModels.registro.idExamen)}"
                                                     oncomplete="PF('dlgTipoExamen').show()" update=":frmDialogoTipo" 
                                                     styleClass="ui-button-info" />
                                </p:toolbarGroup>
                            </p:toolbar>

                            <p:dataTable id="dtTipos" value="#{examenTipoExamenModels.getRegistrosPorExamen(examenModels.registro.idExamen)}"
                                         var="et" emptyMessage="#{msg['exam.msg_tipos_vacio']}" size="small" stripedRows="true"
                                         selectionMode="single" selection="#{examenTipoExamenModels.registro}" rowKey="#{et.idExamenTipoExamen}">

                                <p:ajax event="rowSelect" update="dtTipos" />
                                <p:ajax event="rowUnselect" update="dtTipos" />
                                <p:ajax event="rowDblselect" listener="#{examenTipoExamenModels.btnSeleccionarRegistro(examenTipoExamenModels.registro.idExamenTipoExamen)}"
                                        update=":frmDialogoTipo" oncomplete="PF('dlgTipoExamen').show()" />

                                <p:column headerText="#{msg['exam.col_categoria']}">
                                    <h:outputText value="#{et.idTipoExamen.nombre}" style="font-weight: 500;" />
                                </p:column>

                                <p:column headerText="#{msg['exam.col_obs_vinculo']}">
                                    <h:outputText value="#{et.observaciones}" />
                                </p:column>

                                <f:facet name="footer">
                                    <p:commandButton icon="pi pi-pencil" value="#{msg['exam.btn_edit_vinculo']}"
                                                     styleClass="ui-button-warning"
                                                     actionListener="#{examenTipoExamenModels.btnSeleccionarRegistro(examenTipoExamenModels.registro.idExamenTipoExamen)}"
                                                     update=":frmDialogoTipo" oncomplete="PF('dlgTipoExamen').show()" 
                                                     disabled="#{empty examenTipoExamenModels.registro.idExamenTipoExamen}"/>

                                    <p:commandButton icon="pi pi-unlink" value="#{msg['exam.btn_desvincular']}"
                                                     styleClass="ui-button-danger ui-button-outlined"
                                                     actionListener="#{examenTipoExamenModels.btnEliminarHandler(examenTipoExamenModels.registro.idExamenTipoExamen)}"
                                                     update="dtTipos :mensajesGlobales:growl-sticky"
                                                     disabled="#{empty examenTipoExamenModels.registro.idExamenTipoExamen}">
                                        <p:confirm header="#{msg['global.confirmacion']}" message="#{msg['exam.msg_desvincular']}" icon="pi pi-exclamation-triangle"/>
                                    </p:commandButton>
                                </f:facet>
                            </p:dataTable>
                        </p:tab>
                    </p:tabView>

                    <p:divider />
                    <div style="text-align: right; padding-top: 10px;">
                        <p:commandButton value="#{msg['global.guardar']}" icon="pi pi-save"
                                         actionListener="#{examenModels.btnCrearhandler}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgExamen').hide()"
                                         rendered="#{examenModels.estado == 'CREAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />

                        <p:commandButton value="#{msg['global.actualizar']}" icon="pi pi-refresh"
                                         actionListener="#{examenModels.btnModificarHandler()}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgExamen').hide()"
                                         rendered="#{examenModels.estado == 'MODIFICAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />
                                         
                        <p:commandButton value="#{msg['global.cancelar']}" icon="pi pi-times"
                                         actionListener="#{examenModels.btnCancelar}"
                                         update=":frmTabla"
                                         oncomplete="PF('dlgExamen').hide()"
                                         styleClass="ui-button-secondary ui-button-flat" immediate="true" />
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

        <p:dialog header="#{msg['exam.modal_tipo_tit']}" widgetVar="dlgTipoExamen" modal="true" resizable="false" 
                  width="500" dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">

            <h:form id="frmDialogoTipo">
                <p:outputPanel rendered="#{examenTipoExamenModels.registro != null}">
                    
                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="cmbTipoExamen" value="#{msg['exam.lbl_sel_tipo']}" />
                        <p:selectOneMenu id="cmbTipoExamen" value="#{examenTipoExamenModels.registro.idTipoExamen}"
                                         converter="tipoExamenConverter" required="true" requiredMessage="#{msg['exam.msg_req_tipo']}">
                            <f:selectItem itemLabel="#{msg['exam.sel_tipo']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{examenTipoExamenModels.tiposExamen}" var="te" itemValue="#{te}" itemLabel="#{te.nombre}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="txtObsVinculo" value="#{msg['exam.lbl_obs_vinculo']}" />
                        <p:inputTextarea id="txtObsVinculo" value="#{examenTipoExamenModels.registro.observaciones}" rows="3" placeholder="#{msg['exam.ph_obs_vinculo']}" />
                    </div>

                    <p:divider />
                    <div style="text-align: right; margin-top: 10px;">
                        <p:commandButton value="#{msg['exam.btn_crear_vinc']}" icon="pi pi-save"
                                         rendered="#{examenTipoExamenModels.estado == 'CREAR'}"
                                         actionListener="#{examenTipoExamenModels.btnCrearhandler}"
                                         update=":frmExamen:tabVExamen:dtTipos :frmDialogoTipo :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgTipoExamen').hide()" 
                                         styleClass="ui-button-success" />

                        <p:commandButton value="#{msg['exam.btn_actualizar_vinc']}" icon="pi pi-refresh"
                                         rendered="#{examenTipoExamenModels.estado == 'MODIFICAR'}"
                                         actionListener="#{examenTipoExamenModels.btnModificarHandler()}"
                                         update=":frmExamen:tabVExamen:dtTipos :frmDialogoTipo :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgTipoExamen').hide()" 
                                         styleClass="ui-button-success" />
                    </div>

                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
