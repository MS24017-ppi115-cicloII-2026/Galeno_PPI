<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['proc.titulo']}</ui:define>

    <ui:define name="cuerpo">
        <h:form id="frmTabla">
            <h:panelGroup id="bloqueTabla" layout="block" rendered="#{procedimientoModels.registro == null}">
            <div class="ui-g">
                <div class="ui-g-12">
                    <div style="margin-bottom: 12px;">
                        <p:commandButton value="#{msg['proc.btn_nuevo']}" icon="pi pi-plus"
                                         actionListener="#{procedimientoModels.btnNuevoHandler}"
                                         update=":frmTabla :frmEditor"
                                         resetValues="true"
                                         styleClass="ui-button-success" />
                    </div>

                    <p:dataTable id="tablaRegistros" value="#{procedimientoModels.registros}" var="p"
                                 rowKey="#{p.idProcedimiento}"
                                 selectionMode="single"
                                 emptyMessage="#{msg['proc.msg_vacio']}"
                                 styleClass="tabla-procedimientos"
                                 style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                        <p:column headerText="#{msg['global.id']}" width="32%">
                            <h:outputText value="#{p.idProcedimiento}" />
                            <span class="js-idp" data-id="#{p.idProcedimiento}" style="display:none;"></span>
                        </p:column>

                        <p:column headerText="#{msg['proc.col_nombre']}">
                            <h:outputText value="#{p.nombre}" />
                        </p:column>

                        <p:column headerText="#{msg['global.estado']}" width="12%" style="text-align: center;">
                            <h:outputText value="#{p.activo ? msg['global.activo'] : msg['global.inactivo']}" />
                        </p:column>

                        <p:column headerText="#{msg['global.observaciones']}" width="26%">
                            <h:outputText value="#{p.observaciones}" />
                        </p:column>
                    </p:dataTable>

                    <div style="margin-top: 12px;">
                        <p:commandButton value="#{msg['global.modificar']}" icon="pi pi-pencil"
                                         onclick="return elegirModificado();"
                                         action="#{procedimientoModels.editarSeleccionado}"
                                         resetValues="true"
                                         update=":frmTabla :frmEditor :mensajesGlobales:growl-sticky"
                                         styleClass="ui-button-warning js-modificar-procedimiento" />
                    </div>
                </div>
            </div>
            </h:panelGroup>

            <p:remoteCommand name="rcAbrirProc" action="#{procedimientoModels.abrirPorParametro}"
                             resetValues="true"
                             update=":frmTabla :frmEditor :mensajesGlobales:growl-sticky" />

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
                <p:commandButton value="#{msg['global.cancelar']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['global.si_eliminar']}" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>

        <script type="text/javascript">
           
            function elegirModificado() {
                var fila = $('#frmTabla .tabla-procedimientos tbody tr.ui-state-highlight').first();
                if (fila.length > 0) {
                    var id = fila.find('.js-idp').attr('data-id');
                    if (id) {
                        rcAbrirProc([{name:'idProc', value:id}]);
                        return false;
                    }
                }
                return true;
            }
            $(function () {
                $(document).on('dblclick', '#frmTabla .tabla-procedimientos tbody tr', function (evento) {
                    if ($(evento.target).closest('button').length > 0) {
                        return;
                    }
                    var id = $(this).find('.js-idp').attr('data-id');
                    if (id) {
                        rcAbrirProc([{name:'idProc', value:id}]);
                    }
                });

                $(document).on('dblclick', '#frmEditor .tabla-pasos tbody tr', function (evento) {
                    var destino = $(evento.target);
                    if (destino.closest('button').length > 0
                            || destino.closest('.ui-treetable-toggler').length > 0) {
                        return;
                    }
                    $(this).trigger('click');
                    var abrir = $('#frmEditor .js-abrir-paso');
                    if (abrir.length > 0) {
                        abrir.first().click();
                    }
                });
            });
        </script>

        <h:form id="frmEditor">
            <h:panelGroup id="bloqueEditor" layout="block" rendered="#{procedimientoModels.registro != null}">
                    <p:tabView id="tabProcedimiento">
                        <p:tab title="#{msg['proc.tab_detalle']}">
                            <h:outputText value="#{msg['proc.ayuda_info']}" styleClass="texto-ayuda"/>

                            <div class="ui-fluid ui-g">
                                <h:panelGroup layout="block" styleClass="ui-g-12 campo-formulario"
                                              rendered="#{procedimientoModels.estado == 'MODIFICAR'}">
                                    <p:outputLabel value="#{msg['global.id']}" />
                                    <br />
                                    <h:outputText value="#{procedimientoModels.registro.idProcedimiento}" style="font-family: monospace;" />
                                </h:panelGroup>

                                <div class="ui-g-12 ui-md-8 campo-formulario">
                                    <p:outputLabel for="txtNombre" value="#{msg['proc.lbl_nombre']}" />
                                    <p:inputText id="txtNombre" value="#{procedimientoModels.registro.nombre}" required="true" placeholder="#{msg['proc.ph_nombre']}" />
                                </div>

                                <div class="ui-g-12 ui-md-4 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                                    <div class="ui-inputgroup">
                                        <div class="ui-inputgroup-addon"><i class="pi pi-power-off"></i></div>
                                        <span style="margin-left: 10px; margin-right: 10px;">#{msg['global.es_activo']}</span>
                                        <p:toggleSwitch id="chkActivo" value="#{procedimientoModels.registro.activo}" />
                                    </div>
                                </div>

                                <div class="ui-g-12 campo-formulario">
                                    <p:outputLabel for="txtObservaciones" value="#{msg['global.observaciones_adicionales']}" />
                                    <p:inputTextarea id="txtObservaciones" value="#{procedimientoModels.registro.observaciones}" rows="3" placeholder="#{msg['proc.ph_obs']}" />
                                </div>
                            </div>

                            <p:divider />
                            <div style="text-align: right; padding-top: 10px;">
                                <crud:botonesCrud
                                    modelo="#{procedimientoModels}"
                                    update=":frmTabla :frmEditor :mensajesGlobales:growl-sticky" />
                            </div>
                        </p:tab>

                        <p:tab title="#{msg['proc.tab_pasos']}" disabled="#{procedimientoModels.estado == 'CREAR'}">
                            <h:panelGroup id="panelPasos" layout="block">
                                <h:panelGroup layout="block" style="margin-bottom: 10px; text-align: right;"
                                              rendered="#{empty procedimientoModels.arbolPasos.children}">
                                    <p:commandButton value="#{msg['proc.btn_add_paso_inicial']}" icon="pi pi-plus" styleClass="ui-button-info ui-button-sm"
                                                     action="#{procedimientoPasoModels.prepararNuevoParaProcedimiento(procedimientoModels.registro.idProcedimiento)}"
                                                     resetValues="true"
                                                     update=":frmDialogoPaso" oncomplete="PF('dlgPaso').show()" />
                                </h:panelGroup>

                                <p:treeTable id="tablaPasos" value="#{procedimientoModels.arbolPasos}" var="nodo"
                                         selectionMode="single" selection="#{procedimientoModels.nodoSeleccionado}"
                                         emptyMessage="#{msg['proc.sin_pasos']}"
                                         scrollHeight="320"
                                         styleClass="tabla-pasos"
                                         style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                                <p:column headerText="#{msg['proc.col_nombre']}" title="#{msg['proc.ayuda_doble_clic']}">
                                    <p:treeNode type="toggle">
                                        <h:outputText value="#{nodo.paso.nombre}" />
                                    </p:treeNode>
                                </p:column>

                                <p:column headerText="#{msg['proc.col_rol']}" width="20%">
                                    <h:outputText value="#{nodo.paso.idRol.nombre}"
                                                  rendered="#{nodo.paso.idRol != null}" />
                                </p:column>

                                <p:column headerText="#{msg['proc.col_examenes_asociados']}" width="30%">
                                    <h:outputText value="#{msg['proc.sin_examenes']}" rendered="#{empty nodo.examenes}"
                                                  style="color: #999; font-style: italic;" />
                                    <h:outputText value="#{nodo.nombresExamenes}" rendered="#{not empty nodo.examenes}" />
                                </p:column>

                                <p:column headerText="#{msg['proc.col_indica_fin']}" width="14%" style="text-align: center;">
                                    <h:outputText value="#{nodo.paso.indicaFin ? msg['global.si'] : msg['global.no']}" />
                                </p:column>
                            </p:treeTable>
                                <p:commandButton style="display:none" styleClass="js-abrir-paso"
                                                 action="#{procedimientoModels.abrirEditorPaso}"
                                                     resetValues="true"
                                                 update=":frmDialogoPaso :mensajesGlobales:growl-sticky"
                                                 oncomplete="if(!args.validationFailed) PF('dlgPaso').show()" />
                            </h:panelGroup>
                        </p:tab>
                    </p:tabView>
            </h:panelGroup>
        </h:form>

        <p:dialog header="#{msg['proc.modal_paso_tit']}" widgetVar="dlgPaso" modal="true" resizable="false" width="650"
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            <h:form id="frmDialogoPaso">
                <p:outputPanel rendered="#{procedimientoPasoModels.registro != null}">

                    <h:outputText value="#{msg['proc.ayuda_info_paso']}" styleClass="texto-ayuda"/>

                    <div class="ui-fluid ui-g">
                        <h:panelGroup layout="block" styleClass="ui-g-12 campo-formulario"
                                      rendered="#{procedimientoPasoModels.estado == 'MODIFICAR'}">
                            <p:outputLabel value="#{msg['global.id']}" />
                            <br />
                            <h:outputText value="#{procedimientoPasoModels.registro.idProcedimientoPaso}" />
                        </h:panelGroup>

                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="txtPasoNombre" value="#{msg['proc.lbl_desc_paso']}" />
                            <p:inputText id="txtPasoNombre" value="#{procedimientoPasoModels.registro.nombre}" required="true" placeholder="#{msg['proc.ph_desc_paso']}" />
                        </div>

                        <div class="ui-g-12 ui-md-6 campo-formulario">
                            <p:outputLabel for="cmbRol" value="#{msg['proc.lbl_rol']}" />
                            <p:selectOneMenu id="cmbRol" value="#{procedimientoPasoModels.registro.idRol}" converter="rolConverter" required="true">
                                <f:selectItem itemLabel="#{msg['proc.sel_rol']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoModels.roles}" var="rl" itemValue="#{rl}" itemLabel="#{rl.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6 campo-formulario"
                                      rendered="#{not empty procedimientoPasoModels.nombrePasoPadre}">
                            <p:outputLabel for="txtDependeDe" value="#{msg['proc.lbl_depende_de']}" />
                            <p:inputText id="txtDependeDe" value="#{procedimientoPasoModels.nombrePasoPadre}" disabled="true" />
                        </h:panelGroup>

                        <div class="ui-g-12 ui-md-6 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                            <div class="ui-inputgroup">
                                <span style="margin-right: 10px;">#{msg['proc.lbl_fin']}</span>
                                <p:toggleSwitch id="chkIndicaFin" value="#{procedimientoPasoModels.registro.indicaFin}" />
                            </div>
                        </div>

                        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6 campo-formulario"
                                      rendered="#{procedimientoPasoModels.estado == 'CREAR'}">
                            <p:outputLabel for="cmbExamenNuevo" value="#{msg['proc.examen_opcional']}" />
                            <p:selectOneMenu id="cmbExamenNuevo" value="#{procedimientoPasoModels.idExamenNuevo}">
                                <f:selectItem itemLabel="#{msg['proc.sel_ninguno']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoExamenModels.examenes}" var="ex" itemValue="#{ex.idExamen}" itemLabel="#{ex.nombre}" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </div>

                    <h:panelGroup layout="block" rendered="#{procedimientoPasoModels.estado == 'MODIFICAR'}">
                        <p:divider />
                        <h:outputText value="#{msg['proc.examen_opcional']}" styleClass="titulo-seccion"/>
                        <div class="ui-g lista-examenes">
                            <div class="ui-g-12 ui-md-8">
                                <h:outputText value="#{msg['proc.sin_examenes']}"
                                              rendered="#{empty procedimientoPasoExamenModels.getRegistrosPorPaso(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                              style="color: #999; font-style: italic;" />
                                <p:selectOneListbox id="lstExamenes" value="#{procedimientoPasoExamenModels.idAsociacionSeleccionada}"
                                                    rendered="#{not empty procedimientoPasoExamenModels.getRegistrosPorPaso(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                                    style="width: 100%;">
                                    <f:selectItems value="#{procedimientoPasoExamenModels.getRegistrosPorPaso(procedimientoPasoModels.registro.idProcedimientoPaso)}" var="pe" itemValue="#{pe.idProcedimientoPasoExamen}" itemLabel="#{pe.idExamen.nombre}" />
                                </p:selectOneListbox>
                            </div>
                            <div class="ui-g-12 ui-md-4" style="display: flex; flex-direction: column; gap: 8px; justify-content: flex-start;">
                                <p:commandButton value="#{msg['proc.btn_add_examen']}" icon="pi pi-plus" styleClass="ui-button-info ui-button-sm"
                                                 action="#{procedimientoPasoExamenModels.prepararNuevoParaPaso(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                                 update=":frmDialogoPasoExamen" oncomplete="PF('dlgPasoExamen').show()" />
                                <p:commandButton value="#{msg['global.eliminar']}" icon="pi pi-trash" styleClass="ui-button-danger ui-button-sm"
                                                 action="#{procedimientoPasoExamenModels.eliminarSeleccionado}"
                                                 update=":frmDialogoPaso :mensajesGlobales:growl-sticky" />
                            </div>
                        </div>
                    </h:panelGroup>

                    <p:divider />
                    <div style="text-align: right;">
                        <p:commandButton value="#{msg['proc.btn_nuevo_dependiente']}" icon="pi pi-sitemap" styleClass="ui-button-info"
                                         rendered="#{procedimientoPasoModels.estado == 'MODIFICAR' and !procedimientoPasoModels.hayPasoFinal(procedimientoModels.registro.idProcedimiento)}"
                                         action="#{procedimientoPasoModels.prepararNuevoDependiente(procedimientoModels.registro.idProcedimiento)}"
                                                         resetValues="true"
                                         update=":frmDialogoPasoDependiente"
                                         oncomplete="PF('dlgPaso').hide();PF('dlgPasoDependiente').show();" />
                        <crud:botonesCrud
                            modelo="#{procedimientoPasoModels}"
                            update=":frmTabla :frmEditor:tabProcedimiento:panelPasos :frmDialogoPaso :mensajesGlobales:growl-sticky"
                            oncompleteCrear="if(!args.validationFailed) PF('dlgPaso').hide()"
                            oncompleteModificar="if(!args.validationFailed) PF('dlgPaso').hide()"
                            oncompleteCancelar="PF('dlgPaso').hide()"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

        <p:dialog header="#{msg['proc.btn_nuevo_dependiente']}" widgetVar="dlgPasoDependiente" modal="true" resizable="false" width="650"
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            <h:form id="frmDialogoPasoDependiente">
                <p:outputPanel rendered="#{procedimientoPasoModels.registro != null}">

                    <h:outputText value="#{msg['proc.ayuda_info_paso']}" styleClass="texto-ayuda"/>

                    <div class="ui-fluid ui-g">
                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="txtPasoNombreDep" value="#{msg['proc.lbl_desc_paso']}" />
                            <p:inputText id="txtPasoNombreDep" value="#{procedimientoPasoModels.registro.nombre}" required="true" placeholder="#{msg['proc.ph_desc_paso']}" />
                        </div>

                        <div class="ui-g-12 ui-md-6 campo-formulario">
                            <p:outputLabel for="cmbRolDep" value="#{msg['proc.lbl_rol']}" />
                            <p:selectOneMenu id="cmbRolDep" value="#{procedimientoPasoModels.registro.idRol}" converter="rolConverter" required="true">
                                <f:selectItem itemLabel="#{msg['proc.sel_rol']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoModels.roles}" var="rl" itemValue="#{rl}" itemLabel="#{rl.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6 campo-formulario"
                                      rendered="#{not empty procedimientoPasoModels.nombrePasoPadre}">
                            <p:outputLabel for="txtDependeDeDep" value="#{msg['proc.lbl_depende_de']}" />
                            <p:inputText id="txtDependeDeDep" value="#{procedimientoPasoModels.nombrePasoPadre}" disabled="true" />
                        </h:panelGroup>

                        <div class="ui-g-12 ui-md-6 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                            <div class="ui-inputgroup">
                                <span style="margin-right: 10px;">#{msg['proc.lbl_fin']}</span>
                                <p:toggleSwitch id="chkIndicaFinDep" value="#{procedimientoPasoModels.registro.indicaFin}" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-md-6 campo-formulario">
                            <p:outputLabel for="cmbExamenNuevoDep" value="#{msg['proc.examen_opcional']}" />
                            <p:selectOneMenu id="cmbExamenNuevoDep" value="#{procedimientoPasoModels.idExamenNuevo}">
                                <f:selectItem itemLabel="#{msg['proc.sel_ninguno']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoExamenModels.examenes}" var="ex" itemValue="#{ex.idExamen}" itemLabel="#{ex.nombre}" />
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <p:divider />
                    <div style="text-align: right;">
                        <crud:botonesCrud
                            modelo="#{procedimientoPasoModels}"
                            update=":frmTabla :frmEditor:tabProcedimiento:panelPasos :frmDialogoPasoDependiente :mensajesGlobales:growl-sticky"
                            oncompleteCrear="if(!args.validationFailed) PF('dlgPasoDependiente').hide()"
                            oncompleteCancelar="PF('dlgPasoDependiente').hide()"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

        <p:dialog header="#{msg['proc.modal_examen_tit']}" widgetVar="dlgPasoExamen" modal="true" resizable="false"
                  dynamic="true" appendTo="@(body)" width="450">
            <h:form id="frmDialogoPasoExamen">
                <p:outputPanel rendered="#{procedimientoPasoExamenModels.registro != null}">
                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="cmbExamen" value="#{msg['proc.lbl_sel_examen']}" />
                        <p:selectOneMenu id="cmbExamen" value="#{procedimientoPasoExamenModels.registro.idExamen}" converter="examenConverter" required="true">
                            <f:selectItem itemLabel="#{msg['proc.sel_examen']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{procedimientoPasoExamenModels.examenes}" var="ex" itemValue="#{ex}" itemLabel="#{ex.nombre}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="ui-fluid campo-formulario" style="margin-top: 15px;">
                        <p:toggleSwitch id="chkActivoExamen" value="#{procedimientoPasoExamenModels.registro.activo}" />
                        <p:outputLabel for="chkActivoExamen" value="#{msg['proc.lbl_es_oblig']}" style="display: inline-block; transform: translateY(-5px); margin-left: 10px;" />
                    </div>

                    <p:divider />
                    <div style="text-align: right;">
                        <crud:botonesCrud
                            modelo="#{procedimientoPasoExamenModels}"
                            update=":frmDialogoPaso :frmEditor:tabProcedimiento:panelPasos :mensajesGlobales:growl-sticky"
                            oncompleteCrear="if(!args.validationFailed) PF('dlgPasoExamen').hide()"
                            oncompleteModificar="if(!args.validationFailed) PF('dlgPasoExamen').hide()"
                            oncompleteCancelar="PF('dlgPasoExamen').hide()"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
