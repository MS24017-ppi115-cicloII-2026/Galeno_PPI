<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['proc.titulo']}</ui:define>

    <ui:define name="cuerpo">
        <h:form id="frmTabla">
            <div class="ui-g">
                <div class="ui-g-12">
                    <p:toolbar style="margin-bottom: 15px; border-radius: 8px;">
                        <p:toolbarGroup>
                            <p:commandButton value="#{msg['proc.btn_nuevo']}" icon="pi pi-plus"
                                             actionListener="#{procedimientoModels.btnNuevoHandler}"
                                             update=":frmProcedimiento" oncomplete="PF('dlgProcedimiento').show()"
                                             styleClass="ui-button-success" />
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaRegistros" value="#{procedimientoModels.registros}" var="r"
                                 emptyMessage="#{msg['proc.msg_vacio']}" 
                                 paginator="true" rows="10" selectionMode="single" 
                                 selection="#{procedimientoModels.registro}" rowKey="#{r.idProcedimiento}"
                                 stripedRows="true" style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                        <p:ajax event="rowSelect" update="@form" />
                        <p:ajax event="rowUnselect" update="@form" />
                        <p:ajax event="rowDblselect" listener="#{procedimientoModels.btnSeleccionarRegistro(procedimientoModels.registro.idProcedimiento)}" 
                                update=":frmProcedimiento" oncomplete="PF('dlgProcedimiento').show()" />

                        <p:column headerText="#{msg['global.codigo_id']}" width="25%">
                            <h:outputText value="#{r.idProcedimiento}" style="font-family: monospace; color: gray;" />
                        </p:column>
                        
                        <p:column headerText="#{msg['proc.col_nombre']}">
                            <h:outputText value="#{r.nombre}" style="font-weight: bold;"/>
                        </p:column>
                        
                        <p:column headerText="#{msg['global.estado']}" width="15%" style="text-align: center;">
                            <h:outputText value="#{msg['global.activo']}" rendered="#{r.activo}" styleClass="badge badge-activo" />
                            <h:outputText value="#{msg['global.inactivo']}" rendered="#{not r.activo}" styleClass="badge badge-inactivo" />
                        </p:column>

                        <f:facet name="footer">
                            <div class="acciones-tabla">
                                <p:commandButton id="btnModificar" value="#{msg['proc.btn_config']}" icon="pi pi-cog"
                                                 actionListener="#{procedimientoModels.btnSeleccionarRegistro(procedimientoModels.registro.idProcedimiento)}"
                                                 update=":frmProcedimiento" oncomplete="PF('dlgProcedimiento').show()"
                                                 disabled="#{empty procedimientoModels.registro.idProcedimiento}"
                                                 styleClass="ui-button-primary" />

                                <p:commandButton id="btnEliminar" value="#{msg['global.eliminar']}" icon="pi pi-trash"
                                                 actionListener="#{procedimientoModels.btnEliminarHandler(procedimientoModels.registro.idProcedimiento)}"
                                                 update="frmTabla:tablaRegistros :mensajesGlobales:growl-sticky @form"
                                                 disabled="#{empty procedimientoModels.registro.idProcedimiento}"
                                                 styleClass="ui-button-danger ui-button-outlined">
                                    <p:confirm header="#{msg['global.confirmacion_critica']}" message="#{msg['proc.msg_eliminar']}" icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
                <p:commandButton value="#{msg['global.cancelar']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['global.si_eliminar']}" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>

        <p:dialog header="#{procedimientoModels.estado == 'CREAR' ? msg['proc.modal_crear'] : msg['proc.modal_config']}" 
                  widgetVar="dlgProcedimiento" modal="true" resizable="false" width="850" height="500" 
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            
            <h:form id="frmProcedimiento">
                <p:outputPanel rendered="#{procedimientoModels.registro != null}">
                    <p:tabView id="tabVDetalles">
                        
                        <p:tab title="#{msg['proc.tab_info']}">
                            <h:outputText value="#{msg['proc.ayuda_info']}" styleClass="texto-ayuda"/>
                            
                            <div class="ui-fluid ui-g">
                                <div class="ui-g-12 ui-md-8 campo-formulario">
                                    <p:outputLabel for="txtNombre" value="#{msg['proc.lbl_nombre']}" />
                                    <p:inputText id="txtNombre" value="#{procedimientoModels.registro.nombre}" required="true" placeholder="#{msg['proc.ph_nombre']}" />
                                </div>
                                
                                <div class="ui-g-12 ui-md-4 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                                    <div class="ui-inputgroup">
                                        <div class="ui-inputgroup-addon"><i class="pi pi-power-off"></i></div>
                                        <span style="margin-left: 10px; margin-right: 10px;">#{msg['global.es_activo']}</span>
                                        <p:toggleSwitch id="chkActivo" value="#{procedimientoModels.registro.activo}" />
                                    </div>
                                </div>

                                <div class="ui-g-12 campo-formulario">
                                    <p:outputLabel for="txtObservaciones" value="#{msg['global.observaciones_adicionales']}" />
                                    <p:inputTextarea id="txtObservaciones" value="#{procedimientoModels.registro.observaciones}" rows="3" placeholder="#{msg['proc.ph_obs']}" />
                                </div>
                            </div>
                        </p:tab>

                        <p:tab title="#{msg['proc.tab_pasos']}" disabled="#{procedimientoModels.estado == 'CREAR'}">
                            <h:outputText value="#{msg['proc.ayuda_pasos']}" styleClass="texto-ayuda"/>
                            
                            <p:toolbar style="margin-bottom: 10px;">
                                <p:toolbarGroup>
                                    <p:commandButton value="#{msg['proc.btn_add_paso']}" icon="pi pi-plus"
                                                     actionListener="#{procedimientoPasoModels.prepararNuevoParaProcedimiento(procedimientoModels.registro.idProcedimiento)}"
                                                     oncomplete="PF('dlgPaso').show()" update=":frmDialogoPaso" 
                                                     styleClass="ui-button-info" />
                                </p:toolbarGroup>
                            </p:toolbar>

                            <p:dataTable id="dtPasos" value="#{procedimientoPasoModels.getRegistrosPorProcedimiento(procedimientoModels.registro.idProcedimiento)}" 
                                         var="paso" emptyMessage="#{msg['proc.msg_pasos_vacio']}" size="small" stripedRows="true"
                                         selectionMode="single" selection="#{procedimientoPasoModels.registro}" rowKey="#{paso.idProcedimientoPaso}">
                                
                                <p:ajax event="rowSelect" update="dtPasos" />
                                <p:ajax event="rowUnselect" update="dtPasos" />
                                <p:ajax event="rowDblselect" listener="#{procedimientoPasoModels.btnSeleccionarRegistro(procedimientoPasoModels.registro.idProcedimientoPaso)}" 
                                        update=":frmDialogoPaso" oncomplete="PF('dlgPaso').show()" />

                                <p:column headerText="#{msg['proc.col_paso']}">
                                    <h:outputText value="#{paso.nombre}" style="font-weight: 500;" />
                                </p:column>
                                
                                <p:column headerText="#{msg['proc.col_rol']}" width="25%">
                                    <h:outputText value="#{paso.idRol.nombre}" styleClass="badge badge-info" />
                                </p:column>

                                <f:facet name="footer">
                                    <p:commandButton icon="pi pi-pencil" value="#{msg['proc.btn_config_paso']}" 
                                                     styleClass="ui-button-warning"
                                                     actionListener="#{procedimientoPasoModels.btnSeleccionarRegistro(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                                     update=":frmDialogoPaso" oncomplete="PF('dlgPaso').show()"
                                                     disabled="#{empty procedimientoPasoModels.registro.idProcedimientoPaso}"/>

                                    <p:commandButton icon="pi pi-trash" value="#{msg['global.eliminar']}" 
                                                     styleClass="ui-button-danger ui-button-outlined"
                                                     actionListener="#{procedimientoPasoModels.btnEliminarHandler(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                                     update="dtPasos :mensajesGlobales:growl-sticky"
                                                     disabled="#{empty procedimientoPasoModels.registro.idProcedimientoPaso}">
                                        <p:confirm header="#{msg['global.confirmacion']}" message="#{msg['proc.msg_eliminar_paso']}" icon="pi pi-exclamation-triangle"/>
                                    </p:commandButton>
                                </f:facet>
                            </p:dataTable>
                        </p:tab>
                    </p:tabView>
                    
                    <p:divider />
                    <div style="text-align: right; padding-top: 10px;">
                        <p:commandButton value="#{msg['global.guardar']}" icon="pi pi-save"
                                         actionListener="#{procedimientoModels.btnCrearhandler}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgProcedimiento').hide()"
                                         rendered="#{procedimientoModels.estado == 'CREAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />

                        <p:commandButton value="#{msg['global.actualizar']}" icon="pi pi-refresh"
                                         actionListener="#{procedimientoModels.btnModificarHandler()}"
                                         update=":frmTabla :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgProcedimiento').hide()"
                                         rendered="#{procedimientoModels.estado == 'MODIFICAR'}"
                                         styleClass="ui-button-success" style="margin-right: 5px;" />
                                         
                        <p:commandButton value="#{msg['global.cancelar']}" icon="pi pi-times"
                                         actionListener="#{procedimientoModels.btnCancelar}"
                                         update=":frmTabla"
                                         oncomplete="PF('dlgProcedimiento').hide()"
                                         styleClass="ui-button-secondary ui-button-flat" immediate="true" />
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

        <p:dialog header="#{msg['proc.modal_paso_tit']}" widgetVar="dlgPaso" modal="true" resizable="false" width="750" 
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            <h:form id="frmDialogoPaso">
                <p:outputPanel rendered="#{procedimientoPasoModels.registro != null}">
                    
                    <p:tabView id="tabVPaso">
                        <p:tab title="#{msg['proc.tab_info_paso']}">
                            <h:outputText value="#{msg['proc.ayuda_info_paso']}" styleClass="texto-ayuda"/>
                            
                            <div class="ui-fluid ui-g">
                                <div class="ui-g-12 campo-formulario">
                                    <p:outputLabel for="txtPasoNombre" value="#{msg['proc.lbl_desc_paso']}" />
                                    <p:inputText id="txtPasoNombre" value="#{procedimientoPasoModels.registro.nombre}" required="true" placeholder="#{msg['proc.ph_desc_paso']}" />
                                </div>

                                <div class="ui-g-12 ui-md-8 campo-formulario">
                                    <p:outputLabel for="cmbRol" value="#{msg['proc.lbl_rol']}" />
                                    <p:selectOneMenu id="cmbRol" value="#{procedimientoPasoModels.registro.idRol}" converter="rolConverter" required="true">
                                        <f:selectItem itemLabel="#{msg['proc.sel_rol']}" itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{procedimientoPasoModels.roles}" var="rl" itemValue="#{rl}" itemLabel="#{rl.nombre}" />
                                    </p:selectOneMenu>
                                </div>

                                <div class="ui-g-12 ui-md-4 campo-formulario" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
                                    <div class="ui-inputgroup">
                                        <span style="margin-right: 10px;">#{msg['proc.lbl_fin']}</span>
                                        <p:toggleSwitch id="chkIndicaFin" value="#{procedimientoPasoModels.registro.indicaFin}" />
                                    </div>
                                </div>
                            </div>

                            <p:divider />
                            <div style="text-align: right;">
                                <p:commandButton value="#{msg['proc.btn_guardar_paso']}" icon="pi pi-save"
                                                 actionListener="#{procedimientoPasoModels.btnCrearhandler}"
                                                 update=":frmProcedimiento:tabVDetalles:dtPasos :frmDialogoPaso :mensajesGlobales:growl-sticky"
                                                 rendered="#{procedimientoPasoModels.estado == 'CREAR'}" styleClass="ui-button-success" />
                                                 
                                <p:commandButton value="#{msg['proc.btn_actualizar_paso']}" icon="pi pi-save"
                                                 actionListener="#{procedimientoPasoModels.btnModificarHandler()}"
                                                 update=":frmProcedimiento:tabVDetalles:dtPasos :frmDialogoPaso :mensajesGlobales:growl-sticky"
                                                 rendered="#{procedimientoPasoModels.estado == 'MODIFICAR'}" styleClass="ui-button-success" />
                            </div>
                        </p:tab>

                        <p:tab title="#{msg['proc.tab_examenes']}" disabled="#{procedimientoPasoModels.estado == 'CREAR'}">
                            <p:commandButton value="#{msg['proc.btn_asignar_examen']}" icon="pi pi-paperclip" styleClass="ui-button-outlined"
                                             actionListener="#{procedimientoPasoExamenModels.btnNuevoHandler}"
                                             oncomplete="PF('dlgPasoExamen').show()" update=":frmDialogoPasoExamen" style="margin-bottom: 15px;"/>
                            
                            <p:dataTable id="dtPasoExamen" value="#{procedimientoPasoExamenModels.registros}" var="pe" emptyMessage="#{msg['proc.msg_examenes_vacio']}" size="small"
                                         selectionMode="single" selection="#{procedimientoPasoExamenModels.registro}" rowKey="#{pe.idProcedimientoPasoExamen}">
                                
                                <p:ajax event="rowSelect" update="dtPasoExamen" />
                                <p:ajax event="rowUnselect" update="dtPasoExamen" />
                                <p:ajax event="rowDblselect" listener="#{procedimientoPasoExamenModels.btnSeleccionarRegistro(procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen)}" 
                                        update=":frmDialogoPasoExamen" oncomplete="PF('dlgPasoExamen').show()" />

                                <p:column headerText="#{msg['proc.col_examen_req']}"><h:outputText value="#{pe.idExamen.nombre}" /></p:column>
                                <p:column headerText="#{msg['proc.col_obligatorio']}" width="20%" style="text-align: center;">
                                    <i class="pi #{pe.activo ? 'pi-check-circle' : 'pi-times-circle'}" style="color: #{pe.activo ? 'green' : 'red'}; font-size: 1.2rem;"></i>
                                </p:column>

                                <f:facet name="footer">
                                    <p:commandButton icon="pi pi-pencil" value="#{msg['global.editar']}" 
                                                     styleClass="ui-button-warning"
                                                     actionListener="#{procedimientoPasoExamenModels.btnSeleccionarRegistro(procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen)}"
                                                     update=":frmDialogoPasoExamen" oncomplete="PF('dlgPasoExamen').show()"
                                                     disabled="#{empty procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen}"/>

                                    <p:commandButton icon="pi pi-trash" value="#{msg['global.quitar']}" 
                                                     styleClass="ui-button-danger ui-button-outlined"
                                                     actionListener="#{procedimientoPasoExamenModels.btnEliminarHandler(procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen)}"
                                                     update="dtPasoExamen :mensajesGlobales:growl-sticky"
                                                     disabled="#{empty procedimientoPasoExamenModels.registro.idProcedimientoPasoExamen}" />
                                </f:facet>
                            </p:dataTable>
                        </p:tab>

                        <p:tab title="#{msg['proc.tab_secuencias']}" disabled="#{procedimientoPasoModels.estado == 'CREAR'}">
                            <p:commandButton value="#{msg['proc.btn_crear_dep']}" icon="pi pi-sort-amount-down" styleClass="ui-button-outlined"
                                             actionListener="#{procedimientoPasoSecuenciaModels.prepararNuevoParaPaso(procedimientoPasoModels.registro.idProcedimientoPaso)}"
                                             oncomplete="PF('dlgPasoSecuencia').show()" update=":frmDialogoPasoSecuencia" style="margin-bottom: 15px;"/>
                            
                            <p:dataTable id="dtPasoSecuencia" value="#{procedimientoPasoSecuenciaModels.getRegistrosPorPaso(procedimientoPasoModels.registro.idProcedimientoPaso)}" 
                                         var="ps" emptyMessage="#{msg['proc.msg_secuencias_vacio']}" size="small"
                                         selectionMode="single" selection="#{procedimientoPasoSecuenciaModels.registro}" rowKey="#{ps.idProcedimientoPasoSecuencia}">
                                
                                <p:ajax event="rowSelect" update="dtPasoSecuencia" />
                                <p:ajax event="rowUnselect" update="dtPasoSecuencia" />
                                <p:ajax event="rowDblselect" listener="#{procedimientoPasoSecuenciaModels.btnSeleccionarRegistro(procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia)}" 
                                        update=":frmDialogoPasoSecuencia" oncomplete="PF('dlgPasoSecuencia').show()" />

                                <p:column headerText="#{msg['proc.col_depende']}"><h:outputText value="#{ps.idProcedimientoPasoReferencia}" /></p:column>
                                <p:column headerText="#{msg['proc.col_condicion']}"><h:outputText value="#{ps.tipoSecuencia}" styleClass="badge badge-info" /></p:column>

                                <f:facet name="footer">
                                    <p:commandButton icon="pi pi-pencil" value="#{msg['global.editar']}" 
                                                     styleClass="ui-button-warning"
                                                     actionListener="#{procedimientoPasoSecuenciaModels.btnSeleccionarRegistro(procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia)}"
                                                     update=":frmDialogoPasoSecuencia" oncomplete="PF('dlgPasoSecuencia').show()"
                                                     disabled="#{empty procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia}"/>

                                    <p:commandButton icon="pi pi-trash" value="#{msg['global.quitar']}" 
                                                     styleClass="ui-button-danger ui-button-outlined"
                                                     actionListener="#{procedimientoPasoSecuenciaModels.btnEliminarHandler(procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia)}"
                                                     update="dtPasoSecuencia :mensajesGlobales:growl-sticky"
                                                     disabled="#{empty procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia}" />
                                </f:facet>
                            </p:dataTable>
                        </p:tab>
                    </p:tabView>
                </p:outputPanel>
            </h:form>
        </p:dialog>

        <p:dialog header="#{msg['proc.modal_examen_tit']}" widgetVar="dlgPasoExamen" modal="true" resizable="false" 
                  dynamic="true" appendTo="@(body)" width="450">
            <h:form id="frmDialogoPasoExamen">
                <p:outputPanel rendered="#{procedimientoPasoExamenModels.registro != null}">
                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="cmbExamen" value="#{msg['proc.lbl_sel_examen']}" />
                        <p:selectOneMenu id="cmbExamen" value="#{procedimientoPasoExamenModels.registro.idExamen}" converter="examenConverter" required="true">
                            <f:selectItem itemLabel="#{msg['proc.sel_examen']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{procedimientoPasoExamenModels.examenes}" var="ex" itemValue="#{ex}" itemLabel="#{ex.nombre}" />
                        </p:selectOneMenu>
                    </div>
                    
                    <div class="ui-fluid campo-formulario" style="margin-top: 15px;">
                        <p:toggleSwitch id="chkActivoExamen" value="#{procedimientoPasoExamenModels.registro.activo}" />
                        <p:outputLabel for="chkActivoExamen" value="#{msg['proc.lbl_es_oblig']}" style="display: inline-block; transform: translateY(-5px); margin-left: 10px;" />
                    </div>
                    
                    <p:divider />
                    <div style="text-align: right;">
                        <p:commandButton value="#{msg['proc.btn_asignar']}" icon="pi pi-check" 
                                         actionListener="#{procedimientoPasoExamenModels.btnCrearhandler}"
                                         update=":frmDialogoPaso:tabVPaso:dtPasoExamen :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgPasoExamen').hide()" 
                                         rendered="#{procedimientoPasoExamenModels.estado == 'CREAR'}" 
                                         styleClass="ui-button-success" />
                                         
                        <p:commandButton value="#{msg['global.actualizar']}" icon="pi pi-check" 
                                         actionListener="#{procedimientoPasoExamenModels.btnModificarHandler()}"
                                         update=":frmDialogoPaso:tabVPaso:dtPasoExamen :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgPasoExamen').hide()" 
                                         rendered="#{procedimientoPasoExamenModels.estado == 'MODIFICAR'}" 
                                         styleClass="ui-button-success" />
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

        <p:dialog header="#{msg['proc.modal_sec_tit']}" widgetVar="dlgPasoSecuencia" modal="true" resizable="false" 
                  dynamic="true" appendTo="@(body)" width="500">
            <h:form id="frmDialogoPasoSecuencia">
                <p:outputPanel rendered="#{procedimientoPasoSecuenciaModels.registro != null}">
                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="cmbPasoRef" value="#{msg['proc.lbl_paso_ref']}" />
                        <p:selectOneMenu id="cmbPasoRef" value="#{procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoReferencia}" required="true">
                            <f:selectItem itemLabel="#{msg['proc.sel_paso_ref']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{procedimientoPasoSecuenciaModels.getPasosPorProcedimiento(procedimientoModels.registro.idProcedimiento)}" 
                                           var="ppr" itemValue="#{ppr.idProcedimientoPaso}" itemLabel="#{ppr.nombre}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="ui-fluid campo-formulario">
                        <p:outputLabel for="txtTipoSecuencia" value="#{msg['proc.lbl_regla']}" />
                        <p:inputText id="txtTipoSecuencia" value="#{procedimientoPasoSecuenciaModels.registro.tipoSecuencia}" required="true" placeholder="AFTER" />
                    </div>
                    
                    <p:divider />
                    <div style="text-align: right;">
                        <p:commandButton value="#{msg['proc.btn_guardar_regla']}" icon="pi pi-save" 
                                         actionListener="#{procedimientoPasoSecuenciaModels.btnCrearhandler}"
                                         update=":frmDialogoPaso:tabVPaso:dtPasoSecuencia :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgPasoSecuencia').hide()" 
                                         rendered="#{procedimientoPasoSecuenciaModels.estado == 'CREAR'}" 
                                         styleClass="ui-button-success" />
                                         
                        <p:commandButton value="#{msg['proc.btn_actualizar_regla']}" icon="pi pi-save" 
                                         actionListener="#{procedimientoPasoSecuenciaModels.btnModificarHandler()}"
                                         update=":frmDialogoPaso:tabVPaso:dtPasoSecuencia :mensajesGlobales:growl-sticky"
                                         oncomplete="if(!args.validationFailed) PF('dlgPasoSecuencia').hide()" 
                                         rendered="#{procedimientoPasoSecuenciaModels.estado == 'MODIFICAR'}" 
                                         styleClass="ui-button-success" />
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
