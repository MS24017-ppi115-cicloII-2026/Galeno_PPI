<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['pps.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <h:form id="frmTabla">
            <div class="ui-g">
                <div class="ui-g-12">
                    <p:toolbar style="margin-bottom: 15px; border-radius: 8px;">
                        <p:toolbarGroup>
                            <p:commandButton value="#{msg['pps.btn_nuevo']}" icon="pi pi-plus"
                                             actionListener="#{procedimientoPasoSecuenciaModels.btnNuevoHandler}"
                                             update=":frmProcedimientoPasoSecuencia" oncomplete="PF('dlgProcedimientoPasoSecuencia').show()"
                                             styleClass="ui-button-success" />
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaRegistros" value="#{procedimientoPasoSecuenciaModels.registros}" var="r"
                                 emptyMessage="#{msg['pps.msg_vacio']}" paginator="true" rows="10"
                                 selectionMode="single" selection="#{procedimientoPasoSecuenciaModels.registro}" 
                                 rowKey="#{r.idProcedimientoPasoSecuencia}"
                                 stripedRows="true" style="box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

                        <p:ajax event="rowSelect" update="@form" />
                        <p:ajax event="rowUnselect" update="@form" />
                        <p:ajax event="rowDblselect" listener="#{procedimientoPasoSecuenciaModels.btnSeleccionarRegistro(procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia)}" 
                                update=":frmProcedimientoPasoSecuencia" oncomplete="PF('dlgProcedimientoPasoSecuencia').show()" />

                        <p:column headerText="#{msg['global.codigo_id']}" width="20%">
                            <h:outputText value="#{r.idProcedimientoPasoSecuencia}" style="font-family: monospace; color: gray;" />
                        </p:column>

                        <p:column headerText="#{msg['pps.col_paso']}">
                            <h:outputText value="#{r.idProcedimientoPaso.nombre}" style="font-weight: bold;" />
                        </p:column>

                        <p:column headerText="#{msg['pps.col_paso_ref']}">
                            <h:outputText value="#{r.idProcedimientoPasoReferencia}" />
                        </p:column>

                        <p:column headerText="#{msg['pps.col_tipo_sec']}" width="20%">
                            <h:outputText value="#{r.tipoSecuencia}" styleClass="badge badge-info" />
                        </p:column>

                        <f:facet name="footer">
                            <div class="acciones-tabla">
                                <p:commandButton id="btnModificar" value="#{msg['pps.btn_modificar']}" icon="pi pi-cog"
                                                 actionListener="#{procedimientoPasoSecuenciaModels.btnSeleccionarRegistro(procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia)}"
                                                 update=":frmProcedimientoPasoSecuencia" oncomplete="PF('dlgProcedimientoPasoSecuencia').show()"
                                                 disabled="#{empty procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia}"
                                                 styleClass="ui-button-primary" />

                                <p:commandButton id="btnEliminar" value="#{msg['global.eliminar']}" icon="pi pi-trash"
                                                 actionListener="#{procedimientoPasoSecuenciaModels.btnEliminarHandler(procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia)}"
                                                 update="frmTabla:tablaRegistros :mensajesGlobales:growl-sticky @form"
                                                 disabled="#{empty procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoSecuencia}"
                                                 styleClass="ui-button-danger ui-button-outlined">
                                    <p:confirm header="#{msg['global.confirmacion']}" message="#{msg['pps.msg_eliminar']}" icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="400">
                <p:commandButton value="#{msg['global.cancelar']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['global.si_eliminar']}" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>

        <p:dialog header="#{procedimientoPasoSecuenciaModels.estado == 'CREAR' ? msg['pps.modal_crear'] : msg['pps.modal_config']}" 
                  widgetVar="dlgProcedimientoPasoSecuencia" modal="true" resizable="false" width="600" 
                  dynamic="true" showEffect="fade" hideEffect="fade" appendTo="@(body)">
            
            <h:form id="frmProcedimientoPasoSecuencia">
                <p:outputPanel rendered="#{procedimientoPasoSecuenciaModels.registro != null}">
                    
                    <h:outputText value="#{msg['pps.ayuda_info']}" styleClass="texto-ayuda" style="margin-bottom: 20px; display: block;"/>
                    
                    <div class="ui-fluid ui-g">
                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="cmbProcedimientoPaso" value="#{msg['pps.lbl_paso']}:" />
                            <p:selectOneMenu id="cmbProcedimientoPaso" value="#{procedimientoPasoSecuenciaModels.registro.idProcedimientoPaso}"
                                             converter="procedimientoPasoConverter" required="true" requiredMessage="#{msg['pps.msg_req_paso']}">
                                <f:selectItem itemLabel="#{msg['pps.sel_paso']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoModels.registros}" var="pp" itemValue="#{pp}" itemLabel="#{pp.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="cmbPasoReferencia" value="#{msg['pps.lbl_paso_ref']}:" />
                            <p:selectOneMenu id="cmbPasoReferencia" value="#{procedimientoPasoSecuenciaModels.registro.idProcedimientoPasoReferencia}"
                                             required="true" requiredMessage="#{msg['pps.msg_req_paso_ref']}">
                                <f:selectItem itemLabel="#{msg['pps.sel_paso_ref']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{procedimientoPasoModels.registros}" var="ppr" itemValue="#{ppr.idProcedimientoPaso}" itemLabel="#{ppr.nombre}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="ui-g-12 campo-formulario">
                            <p:outputLabel for="txtTipoSecuencia" value="#{msg['pps.lbl_tipo_sec']}:" />
                            <p:inputText id="txtTipoSecuencia" value="#{procedimientoPasoSecuenciaModels.registro.tipoSecuencia}"
                                         required="true" requiredMessage="#{msg['pps.msg_req_tipo_sec']}" maxlength="100" placeholder="Ej. AFTER, BEFORE, REQUIRED" />
                        </div>
                    </div>
                    
                    <p:divider />
                    
                    <div style="text-align: right; padding-top: 10px;">
                        <crud:botonesCrud
                            modelo="#{procedimientoPasoSecuenciaModels}"
                            update=":frmTabla :mensajesGlobales:growl-sticky"
                            oncompleteCrear="if(!args.validationFailed) PF('dlgProcedimientoPasoSecuencia').hide()"
                            oncompleteModificar="if(!args.validationFailed) PF('dlgProcedimientoPasoSecuencia').hide()"
                            oncompleteCancelar="PF('dlgProcedimientoPasoSecuencia').hide()"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
