<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['medioContacto.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <h:form id="frmTabla">

            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton
                        value="#{msg['medioContacto.btn_nuevo']}"
                        icon="pi pi-plus"
                        actionListener="#{medioContactoModel.btnNuevoHandler}"
                        update=":frmFormulario @form"/>
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable
                id="tablaRegistros"
                value="#{medioContactoModel.registros}"
                var="r"
                emptyMessage="#{msg['medioContacto.msg_vacio']}"
                paginator="true"
                rows="10"
                style="margin-top: 10px;"
                selectionMode="single"
                selection="#{medioContactoModel.registro}"
                rowKey="#{r.idMedioContacto}">

                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>

                <p:ajax
                    event="rowDblselect"
                    listener="#{medioContactoModel.btnSeleccionarRegistro(medioContactoModel.registro.idMedioContacto)}"
                    update=":frmFormulario"/>

                <p:column headerText="#{msg['global.id']}">
                    <h:outputText value="#{r.idMedioContacto}"/>
                </p:column>

                <p:column headerText="#{msg['medioContacto.col_valor']}">
                    <h:outputText value="#{r.valor}"/>
                </p:column>

                <p:column headerText="#{msg['medioContacto.col_persona']}">
                    <h:outputText
                        value="#{r.idPersona.nombres} #{r.idPersona.apellidos}"/>
                </p:column>

                <p:column headerText="#{msg['medioContacto.col_tipo']}">
                    <h:outputText value="#{r.idTipoMedioContacto.nombre}"/>
                </p:column>

                <p:column headerText="#{msg['medioContacto.col_fecha_creacion']}">
                    <h:outputText value="#{r.fechaCreacion}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy HH:mm"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>

                <f:facet name="footer">

                    <p:commandButton
                        id="btnModificar"
                        value="#{msg['medioContacto.btn_modificar']}"
                        icon="pi pi-pencil"
                        actionListener="#{medioContactoModel.btnSeleccionarRegistro(medioContactoModel.registro.idMedioContacto)}"
                        update=":frmFormulario"
                        disabled="#{empty medioContactoModel.registro.idMedioContacto}"
                        styleClass="ui-button-warning"
                        style="margin-right: 5px;"/>

                    <p:commandButton
                        id="btnEliminar"
                        value="#{msg['global.eliminar']}"
                        icon="pi pi-trash"
                        actionListener="#{medioContactoModel.btnEliminarHandler(medioContactoModel.registro.idMedioContacto)}"
                        update=":mensajesGlobales:growl-sticky @form"
                        disabled="#{empty medioContactoModel.registro.idMedioContacto}"
                        styleClass="ui-button-danger">

                        <p:confirm
                            header="#{msg['global.confirmacion']}"
                            message="#{msg['medioContacto.msg_eliminar']}"
                            icon="pi pi-info-circle"/>

                    </p:commandButton>

                </f:facet>

            </p:dataTable>

            <p:confirmDialog
                global="true"
                showEffect="fade"
                hideEffect="fade"
                responsive="true"
                width="350">

                <p:commandButton
                    value="#{msg['global.no']}"
                    type="button"
                    styleClass="ui-confirmdialog-no ui-button-flat"/>

                <p:commandButton
                    value="#{msg['global.si']}"
                    type="button"
                    styleClass="ui-confirmdialog-yes"/>

            </p:confirmDialog>

        </h:form>


        <h:form id="frmFormulario">

            <p:panel
                header="#{medioContactoModel.estado == 'CREAR' ? msg['medioContacto.modal_crear'] : msg['medioContacto.modal_config']}"
                rendered="#{medioContactoModel.estado != 'NINGUNO'}"
                style="margin-top: 20px;">

                <h:panelGrid columns="2" cellpadding="5">

                    <p:outputLabel
                        value="#{msg['global.codigo_id']}"
                        rendered="#{medioContactoModel.estado == 'CREAR'}"/>

                    <h:outputText
                        value="#{medioContactoModel.registro.idMedioContacto}"
                        rendered="#{medioContactoModel.estado == 'CREAR'}"/>


                    <p:outputLabel
                        for="txtValor"
                        value="#{msg['medioContacto.lbl_valor']}"/>

                    <p:inputText
                        id="txtValor"
                        value="#{medioContactoModel.registro.valor}"
                        required="true"
                        requiredMessage="#{msg['medioContacto.msg_req_valor']}"/>


                    <p:outputLabel
                        for="cmbPersona"
                        value="#{msg['medioContacto.lbl_persona']}"/>

                    <p:selectOneMenu
                        id="cmbPersona"
                        value="#{medioContactoModel.registro.idPersona}"
                        converter="personaConverter"
                        required="true"
                        requiredMessage="#{msg['medioContacto.msg_req_persona']}">

                        <f:selectItem
                            itemLabel="#{msg['medioContacto.sel_persona']}"
                            itemValue="#{null}"
                            noSelectionOption="true"/>

                        <f:selectItems
                            value="#{personaModel.registros}"
                            var="p"
                            itemLabel="#{p.nombres} #{p.apellidos}"
                            itemValue="#{p}"/>

                    </p:selectOneMenu>


                    <p:outputLabel
                        for="cmbTipo"
                        value="#{msg['medioContacto.lbl_tipo']}"/>

                    <p:selectOneMenu
                        id="cmbTipo"
                        value="#{medioContactoModel.registro.idTipoMedioContacto}"
                        converter="tipoMedioContactoConverter"
                        required="true"
                        requiredMessage="#{msg['medioContacto.msg_req_tipo']}">

                        <f:selectItem
                            itemLabel="#{msg['medioContacto.sel_tipo']}"
                            itemValue="#{null}"
                            noSelectionOption="true"/>

                        <f:selectItems
                            value="#{tipoMedioContactoModel.registros}"
                            var="t"
                            itemLabel="#{t.nombre}"
                            itemValue="#{t}"/>

                    </p:selectOneMenu>


                    <p:outputLabel
                        value="#{msg['medioContacto.lbl_fecha_creacion']}"/>

                    <h:outputText value="#{medioContactoModel.registro.fechaCreacion}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy HH:mm"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>

                </h:panelGrid>


                <f:facet name="footer">

                    <crud:botonesCrud
                        modelo="#{medioContactoModel}"
                        update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>

                </f:facet>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>
