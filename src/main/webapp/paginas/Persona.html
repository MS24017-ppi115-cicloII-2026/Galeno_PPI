<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

    <ui:define name="titulo">#{msg['persona.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <h:form id="frmTabla">

            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton
                        value="#{msg['persona.btn_nuevo']}"
                        icon="pi pi-plus"
                        actionListener="#{personaModel.btnNuevoHandler}"
                        update=":frmFormulario @form"/>
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable
                id="tablaRegistros"
                value="#{personaModel.registros}"
                var="r"
                emptyMessage="#{msg['persona.msg_vacio']}"
                paginator="true"
                rows="10"
                style="margin-top: 10px;"
                selectionMode="single"
                selection="#{personaModel.registro}"
                rowKey="#{r.idPersona}">

                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>

                <p:ajax
                    event="rowDblselect"
                    listener="#{personaModel.btnSeleccionarRegistro(personaModel.registro.idPersona)}"
                    update=":frmFormulario"/>

                <p:column headerText="#{msg['global.id']}">
                    <h:outputText value="#{r.idPersona}"/>
                </p:column>

                <p:column headerText="#{msg['persona.col_nombres']}">
                    <h:outputText value="#{r.nombres}"/>
                </p:column>

                <p:column headerText="#{msg['persona.col_apellidos']}">
                    <h:outputText value="#{r.apellidos}"/>
                </p:column>

                <p:column headerText="#{msg['persona.col_fecha_nacimiento']}">
                    <h:outputText value="#{r.fechaNacimiento}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg['persona.col_fecha_creacion']}">
                    <h:outputText value="#{r.fechaCreacion}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy HH:mm"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>

                <f:facet name="footer">

                    <p:commandButton
                        id="btnModificar"
                        value="#{msg['persona.btn_modificar']}"
                        icon="pi pi-pencil"
                        actionListener="#{personaModel.btnSeleccionarRegistro(personaModel.registro.idPersona)}"
                        update=":frmFormulario"
                        disabled="#{empty personaModel.registro.idPersona}"
                        styleClass="ui-button-warning"
                        style="margin-right: 5px;"/>

                    <p:commandButton
                        id="btnEliminar"
                        value="#{msg['global.eliminar']}"
                        icon="pi pi-trash"
                        actionListener="#{personaModel.btnEliminarHandler(personaModel.registro.idPersona)}"
                        update=":mensajesGlobales:growl-sticky @form"
                        disabled="#{empty personaModel.registro.idPersona}"
                        styleClass="ui-button-danger">

                        <p:confirm
                            header="#{msg['global.confirmacion']}"
                            message="#{msg['persona.msg_eliminar']}"
                            icon="pi pi-info-circle"/>

                    </p:commandButton>

                </f:facet>

            </p:dataTable>

            <p:confirmDialog
                global="true"
                showEffect="fade"
                hideEffect="fade"
                responsive="true"
                width="350">

                <p:commandButton
                    value="#{msg['global.no']}"
                    type="button"
                    styleClass="ui-confirmdialog-no ui-button-flat"/>

                <p:commandButton
                    value="#{msg['global.si']}"
                    type="button"
                    styleClass="ui-confirmdialog-yes"/>

            </p:confirmDialog>

        </h:form>


        <h:form id="frmFormulario">

            <p:panel
                header="#{personaModel.estado == 'CREAR' ? msg['persona.modal_crear'] : msg['persona.modal_config']}"
                rendered="#{personaModel.estado != 'NINGUNO'}"
                style="margin-top: 20px;">

                <h:panelGrid columns="2" cellpadding="5">

                    <p:outputLabel
                        value="#{msg['global.codigo_id']}"
                        rendered="#{personaModel.estado == 'CREAR'}"/>

                    <h:outputText
                        value="#{personaModel.registro.idPersona}"
                        rendered="#{personaModel.estado == 'CREAR'}"/>


                    <p:outputLabel
                        for="txtNombres"
                        value="#{msg['persona.lbl_nombres']}"/>

                    <p:inputText
                        id="txtNombres"
                        value="#{personaModel.registro.nombres}"
                        required="true"
                        requiredMessage="#{msg['persona.msg_req_nombres']}"
                        maxlength="155"/>


                    <p:outputLabel
                        for="txtApellidos"
                        value="#{msg['persona.lbl_apellidos']}"/>

                    <p:inputText
                        id="txtApellidos"
                        value="#{personaModel.registro.apellidos}"
                        required="true"
                        requiredMessage="#{msg['persona.msg_req_apellidos']}"
                        maxlength="155"/>


                    <p:outputLabel
                        for="calFechaNacimiento"
                        value="#{msg['persona.lbl_fecha_nacimiento']}"/>

                    <p:datePicker
                        id="calFechaNacimiento"
                        value="#{personaModel.registro.fechaNacimiento}"
                        pattern="dd/MM/yyyy"
                        showIcon="true"/>


                    <p:outputLabel
                        value="#{msg['persona.lbl_fecha_creacion']}"/>

                    <h:outputText
                        value="#{personaModel.registro.fechaCreacion}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy HH:mm"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>

                </h:panelGrid>

                <f:facet name="footer">

                    <crud:botonesCrud
                        modelo="#{personaModel}"
                        update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>

                </f:facet>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>
