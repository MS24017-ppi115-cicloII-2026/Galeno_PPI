<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:crud="jakarta.faces.composite/crud"
                template="./general.xhtml">

<ui:define name="titulo">#{msg['consulta.titulo']}</ui:define>

    <ui:define name="cuerpo">

        <h:form id="frmTabla">

            <h:panelGroup layout="block" style="margin-bottom: 8px;">
                <h:outputText value="#{msg['consulta.sesion_clinica']}: " style="font-weight: 600;"/>
                <h:outputText
                    value="#{empty sesionModels.idClinicaActual ? msg['consulta.filtro_todas'] : sesionModels.nombreClinica}"/>

            </h:panelGroup>

            <h:outputText value="#{msg['consulta.btn_filtrar']}" style="font-weight: 600;"/>

            <h:panelGrid columns="5" styleClass="ui-fluid" cellpadding="5" style="margin-bottom: 15px;">

                <p:outputLabel
                        for="calDesde"
                        value="#{msg['consulta.filtro_desde']}"/>

                    <p:datePicker
                        id="calDesde"
                        value="#{consultaModels.fechaDesde}"
                        pattern="dd/MM/yyyy"
                        showIcon="true"/>

                    <p:outputLabel
                        for="calHasta"
                        value="#{msg['consulta.filtro_hasta']}"/>

                    <p:datePicker
                        id="calHasta"
                        value="#{consultaModels.fechaHasta}"
                        pattern="dd/MM/yyyy"
                        showIcon="true"/>

                    <p:commandButton
                        id="btnFiltrar"
                        value="#{msg['consulta.btn_filtrar']}"
                        icon="pi pi-filter"
                        update=":frmTabla"/>

                </h:panelGrid>

            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton
                        value="#{msg['consulta.btn_nuevo']}"
                        icon="pi pi-plus"
                        actionListener="#{consultaModels.btnNuevoHandler}"
                        update=":tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos @form" styleClass="ui-button-success"/>
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable
                id="tablaRegistros"
                value="#{consultaModels.registros}"
                var="r"
                emptyMessage="#{msg['consulta.msg_vacio']}"
                paginator="true"
                rows="10"
                style="margin-top: 10px;"
                selectionMode="single"
                selection="#{consultaModels.registro}"
                rowKey="#{r.idConsulta}">

                <p:ajax event="rowSelect"
                        listener="#{consultaModels.btnSeleccionarRegistro(consultaModels.registro.idConsulta)}"
                        update="@form :tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos"/>
                <p:ajax event="rowUnselect"
                        listener="#{consultaModels.btnCancelar}"
                        update="@form :tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos"/>
                <p:ajax
                    event="rowDblselect"
                    listener="#{consultaModels.btnSeleccionarRegistro(consultaModels.registro.idConsulta)}"
                    update="@form :tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos"/>

                <p:column headerText="#{msg['global.id']}">
                    <h:outputText value="#{r.idConsulta}"/>
                </p:column>

                <p:column headerText="#{msg['consulta.col_persona']}">
                    <h:outputText
                        value="#{r.idPersonaRol.idPersona.nombres} #{r.idPersonaRol.idPersona.apellidos}"/>
                </p:column>

                <p:column headerText="#{msg['consulta.col_fecha_inicio']}">
                    <h:outputText value="#{r.fechaInicio}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy HH:mm"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg['consulta.col_fecha_fin']}">
                    <h:outputText value="#{r.fechaFin}">
                        <f:convertDateTime
                            pattern="dd/MM/yyyy HH:mm"
                            timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg['consulta.col_referencia_externa']}">
                    <h:outputText value="#{r.referenciaExterna}"/>
                </p:column>

                <p:column headerText="#{msg['consulta.col_observaciones']}">
                    <h:outputText value="#{r.observaciones}"/>
                </p:column>

                <f:facet name="footer">

                    <p:commandButton
                        id="btnModificar"
                        value="#{msg['consulta.btn_modificar']}"
                        icon="pi pi-pencil"
                        actionListener="#{consultaModels.btnSeleccionarRegistro(consultaModels.registro.idConsulta)}"
                        update=":tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos"
                        oncomplete="PF('wTabsConsulta').select(0);document.getElementById('tabsConsulta').scrollIntoView({behavior:'smooth'});"
                        disabled="#{empty consultaModels.registro.idConsulta}"
                        styleClass="ui-button-warning"
                        style="margin-right: 5px;"/>

                    <p:commandButton
                        id="btnEliminar"
                        value="#{msg['global.eliminar']}"
                        icon="pi pi-trash"
                        actionListener="#{consultaModels.btnEliminarHandler(consultaModels.registro.idConsulta)}"
                        update=":mensajesGlobales:growl-sticky :tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos @form"
                        disabled="#{empty consultaModels.registro.idConsulta}"
                        styleClass="ui-button-danger">

                        <p:confirm
                            header="#{msg['global.confirmacion']}"
                            message="#{msg['consulta.msg_eliminar']}"
                            icon="pi pi-info-circle"/>

                    </p:commandButton>

                </f:facet>

            </p:dataTable>

            <p:confirmDialog
                global="true"
                showEffect="fade"
                hideEffect="fade"
                responsive="true"
                width="350">

                <p:commandButton
                    value="#{msg['global.no']}"
                    type="button"
                    styleClass="ui-confirmdialog-no ui-button-flat"/>

                <p:commandButton
                    value="#{msg['global.si']}"
                    type="button"
                    styleClass="ui-confirmdialog-yes"/>

            </p:confirmDialog>

        </h:form>

        <p:tabView id="tabsConsulta" widgetVar="wTabsConsulta" dynamic="false" style="margin-top: 20px;">

            <!--   ====================== DETALLE ======================   -->
            <p:tab title="#{msg['consulta.tab_detalle']}">

                <h:form id="frmDetalle">

                    <p:panel
                        header="#{consultaModels.estado == 'CREAR' ? msg['consulta.modal_crear'] : msg['consulta.modal_config']}"
                        rendered="#{consultaModels.estado != 'NINGUNO'}">

                        <h:panelGrid columns="2" cellpadding="5">

                            <p:outputLabel
                                value="#{msg['global.codigo_id']}"
                                rendered="#{consultaModels.estado == 'CREAR'}"/>

                            <h:outputText
                                value="#{consultaModels.registro.idConsulta}"
                                rendered="#{consultaModels.estado == 'CREAR'}"/>

                            <p:outputLabel
                                for="cmbPersonaRol"
                                value="#{msg['consulta.lbl_persona']}"/>

                            <p:selectOneMenu
                                id="cmbPersonaRol"
                                value="#{consultaModels.registro.idPersonaRol}"
                                converter="personaRolConverter"
                                required="true"
                                requiredMessage="#{msg['consulta.msg_req_persona']}"
                                filter="true"
                                filterMatchMode="contains"
                                disabled="#{consultaModels.estado == 'MODIFICAR'}">

                                <f:selectItem
                                    itemLabel="#{msg['consulta.sel_persona']}"
                                    itemValue="#{null}"
                                    noSelectionOption="true"/>

                                <f:selectItems
                                    value="#{consultaModels.pacientes}"
                                    var="pr"
                                    itemLabel="#{pr.idPersona.nombres} #{pr.idPersona.apellidos} - #{pr.idRol.nombre}"
                                    itemValue="#{pr}"/>

                            </p:selectOneMenu>

                            <p:outputLabel
                                for="calFechaInicio"
                                value="#{msg['consulta.lbl_fecha_inicio_auto']}"/>

                            <p:datePicker
                                id="calFechaInicio"
                                value="#{consultaModels.registro.fechaInicio}"
                                showTime="true"
                                pattern="dd/MM/yyyy HH:mm"
                                showIcon="true"/>

                            <p:outputLabel
                                for="calFechaFin"
                                value="#{msg['consulta.lbl_fecha_fin']}"/>

                            <p:datePicker
                                id="calFechaFin"
                                value="#{consultaModels.registro.fechaFin}"
                                showTime="true"
                                pattern="dd/MM/yyyy HH:mm"
                                showIcon="true"/>

                            <p:outputLabel
                                for="txtReferencia"
                                value="#{msg['consulta.lbl_referencia_externa']}"/>

                            <p:inputText
                                id="txtReferencia"
                                value="#{consultaModels.registro.referenciaExterna}"/>

                            <p:outputLabel
                                for="txtObservaciones"
                                value="#{msg['consulta.lbl_observaciones']}"/>

                            <p:inputTextarea
                                id="txtObservaciones"
                                value="#{consultaModels.registro.observaciones}"
                                rows="3"/>

                        </h:panelGrid>

                        <f:facet name="footer">
                            <crud:botonesCrud
                                modelo="#{consultaModels}"
                                update=":frmTabla :tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos :mensajesGlobales:growl-sticky"/>
                        </f:facet>

                    </p:panel>

                </h:form>

            </p:tab>

            <!--   ================== DOCUMENTOS DEL PACIENTE ==================   -->
            <p:tab title="#{msg['consulta.tab_documentos']}">

                <p:outputPanel id="pnlDocumentos">

                    <h:outputText
                        value="#{msg['consulta.sel_seleccionar']}"
                        rendered="#{not consultaModels.hayConsultaSeleccionada}"/>

                    <p:outputPanel rendered="#{consultaModels.hayConsultaSeleccionada}">

                        <h:outputText
                            value="#{msg['consulta.doc_paciente']}"
                            style="font-weight: 600; display: block; margin-bottom: 8px;"/>

                        <p:dataTable
                            id="tablaDocumentos"
                            value="#{consultaModels.documentosDelPaciente}"
                            var="d"
                            emptyMessage="#{msg['doc.msg_vacio']}"
                            paginator="true"
                            rows="5"
                            style="margin-top: 5px;">

                            <p:column headerText="#{msg['global.id']}">
                                <h:outputText value="#{d.idDocumento}"/>
                            </p:column>

                            <p:column headerText="#{msg['doc.col_tipo_documento']}">
                                <h:outputText value="#{d.idTipoDocumento.nombre}"/>
                            </p:column>

                            <p:column headerText="#{msg['doc.col_valor']}">
                                <h:outputText value="#{d.valor}"/>
                            </p:column>

                            <p:column headerText="#{msg['doc.col_ruta_fisica']}">
                                <h:outputText value="#{d.rutaFisica}"/>
                            </p:column>

                        </p:dataTable>

                    </p:outputPanel>

                </p:outputPanel>

            </p:tab>

            <!--   ====================== PROCEDIMIENTOS ======================   -->
            <p:tab title="#{msg['consulta.tab_procedimientos']}">

                <p:outputPanel id="pnlProcedimientos">

                    <h:outputText
                        value="#{msg['consulta.sel_seleccionar']}"
                        rendered="#{not consultaModels.hayConsultaSeleccionada}"/>

                    <p:outputPanel rendered="#{consultaModels.hayConsultaSeleccionada}">

                        <h:form id="frmProcedimientosTabla">

                            <p:toolbar>
                                <p:toolbarGroup>
                                    <p:commandButton
                                        value="#{msg['cp.btn_nuevo']}"
                                        icon="pi pi-plus"
                                        actionListener="#{consultaProcedimientoModels.btnNuevoHandler}"
                                        update=":tabsConsulta:pnlProcedimientos" styleClass="ui-button-success"/>
                                </p:toolbarGroup>
                            </p:toolbar>

                            <p:dataTable
                                id="tablaProcedimientos"
                                value="#{consultaProcedimientoModels.registrosDeConsulta}"
                                var="cp"
                                emptyMessage="#{msg['cp.msg_vacio']}"
                                paginator="true"
                                rows="5"
                                style="margin-top: 5px;"
                                selectionMode="single"
                                selection="#{consultaProcedimientoModels.registro}"
                                rowKey="#{cp.idConsultaProcedimiento}">

                                <p:ajax event="rowSelect"
                                        listener="#{consultaProcedimientoModels.btnSeleccionarRegistro(consultaProcedimientoModels.registro.idConsultaProcedimiento)}"
                                        update=":tabsConsulta:pnlProcedimientos"/>
                                <p:ajax event="rowUnselect"
                                        listener="#{consultaProcedimientoModels.btnCancelar}"
                                        update=":tabsConsulta:pnlProcedimientos"/>

                                <p:column headerText="#{msg['global.id']}">
                                    <h:outputText value="#{cp.idConsultaProcedimiento}"/>
                                </p:column>

                                <p:column headerText="#{msg['cp.col_procedimiento']}">
                                    <h:outputText
                                        value="#{consultaProcedimientoModels.getNombreProcedimiento(cp.idProcedimiento)}"/>
                                </p:column>

                                <p:column headerText="#{msg['cp.col_fecha_inicio']}">
                                    <h:outputText value="#{cp.fechaInicio}">
                                        <f:convertDateTime
                                            pattern="dd/MM/yyyy HH:mm"
                                            timeZone="America/El_Salvador"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="#{msg['cp.col_fecha_fin']}">
                                    <h:outputText value="#{cp.fechaFin}">
                                        <f:convertDateTime
                                            pattern="dd/MM/yyyy HH:mm"
                                            timeZone="America/El_Salvador"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="#{msg['cp.col_observaciones']}">
                                    <h:outputText value="#{cp.observaciones}"/>
                                </p:column>

                                <p:column headerText="#{msg['cp.col_primer_paso']}">
                                    <h:outputText
                                        value="#{consultaProcedimientoModels.getPrimerPaso(cp.idProcedimiento).nombre}"/>
                                </p:column>

                                <p:column headerText="#{msg['cp.col_encargado']}">
                                    <h:outputText
                                        value="#{consultaProcedimientoModels.getEncargadoDePrimerPaso(cp.idProcedimiento)}"/>
                                </p:column>

                                <f:facet name="footer">
                                    <p:commandButton
                                        value="#{msg['cp.btn_modificar']}"
                                        icon="pi pi-pencil"
                                        actionListener="#{consultaProcedimientoModels.btnSeleccionarRegistro(consultaProcedimientoModels.registro.idConsultaProcedimiento)}"
                                        update=":tabsConsulta:pnlProcedimientos"
                                        disabled="#{empty consultaProcedimientoModels.registro.idConsultaProcedimiento}"
                                        styleClass="ui-button-warning"
                                        style="margin-right: 5px;"/>
                                    <p:commandButton
                                        value="#{msg['global.eliminar']}"
                                        icon="pi pi-trash"
                                        actionListener="#{consultaProcedimientoModels.btnEliminarHandler(consultaProcedimientoModels.registro.idConsultaProcedimiento)}"
                                        update=":tabsConsulta:pnlProcedimientos :mensajesGlobales:growl-sticky"
                                        disabled="#{empty consultaProcedimientoModels.registro.idConsultaProcedimiento}"
                                        styleClass="ui-button-danger">
                                        <p:confirm
                                            header="#{msg['global.confirmacion']}"
                                            message="#{msg['cp.msg_eliminar']}"
                                            icon="pi pi-info-circle"/>
                                    </p:commandButton>
                                </f:facet>

                            </p:dataTable>

                        </h:form>

                        <h:form id="frmProcedimientos">

                            <p:panel
                                header="#{consultaProcedimientoModels.estado == 'CREAR' ? msg['cp.modal_crear'] : msg['cp.modal_config']}"
                                rendered="#{consultaProcedimientoModels.estado != 'NINGUNO'}"
                                style="margin-top: 15px;">

                                <h:panelGrid columns="2" cellpadding="5">

                                    <p:outputLabel
                                        value="#{msg['global.codigo_id']}"
                                        rendered="#{consultaProcedimientoModels.estado == 'CREAR'}"/>

                                    <h:outputText
                                        value="#{consultaProcedimientoModels.registro.idConsultaProcedimiento}"
                                        rendered="#{consultaProcedimientoModels.estado == 'CREAR'}"/>

                                    <p:outputLabel
                                        for="cmbProcedimiento"
                                        value="#{msg['cp.lbl_procedimiento']}"/>

                                    <p:selectOneMenu
                                        id="cmbProcedimiento"
                                        value="#{consultaProcedimientoModels.registro.idProcedimiento}"
                                        required="true"
                                        requiredMessage="#{msg['cp.msg_req_procedimiento']}"
                                        filter="true"
                                        filterMatchMode="contains"
                                        disabled="#{consultaProcedimientoModels.estado == 'MODIFICAR'}">

                                        <f:selectItem
                                            itemLabel="#{msg['cp.sel_procedimiento']}"
                                            itemValue="#{null}"
                                            noSelectionOption="true"/>

                                        <f:selectItems
                                            value="#{consultaProcedimientoModels.procedimientosActivos}"
                                            var="proc"
                                            itemLabel="#{proc.nombre}"
                                            itemValue="#{proc.idProcedimiento}"/>

                                    </p:selectOneMenu>

                                    <p:outputLabel
                                        for="calCpFechaInicio"
                                        value="#{msg['cp.lbl_fecha_inicio_auto']}"/>

                                    <p:datePicker
                                        id="calCpFechaInicio"
                                        value="#{consultaProcedimientoModels.registro.fechaInicio}"
                                        showTime="true"
                                        pattern="dd/MM/yyyy HH:mm"
                                        showIcon="true"/>

                                    <p:outputLabel
                                        for="calCpFechaFin"
                                        value="#{msg['cp.lbl_fecha_fin']}"/>

                                    <p:datePicker
                                        id="calCpFechaFin"
                                        value="#{consultaProcedimientoModels.registro.fechaFin}"
                                        showTime="true"
                                        pattern="dd/MM/yyyy HH:mm"
                                        showIcon="true"/>

                                    <p:outputLabel
                                        for="txtCpObservaciones"
                                        value="#{msg['cp.lbl_observaciones']}"/>

                                    <p:inputTextarea
                                        id="txtCpObservaciones"
                                        value="#{consultaProcedimientoModels.registro.observaciones}"
                                        rows="3"/>

                                </h:panelGrid>

                                <f:facet name="footer">
                                    <crud:botonesCrud
                                        modelo="#{consultaProcedimientoModels}"
                                        update=":frmTabla :tabsConsulta:frmDetalle :tabsConsulta:pnlDocumentos :tabsConsulta:pnlProcedimientos :mensajesGlobales:growl-sticky"/>
                                </f:facet>

                            </p:panel>

                        </h:form>

                    </p:outputPanel>

                </p:outputPanel>

            </p:tab>

        </p:tabView>

    </ui:define>

</ui:composition>
