<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core" xmlns:crud="jakarta.faces.composite/crud" template="./general.xhtml">
    <ui:define name="titulo">#{msg['consprocpaso.titulo']}</ui:define>
    <ui:define name="cuerpo">
        <h:form id="frmTabla">
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="#{msg['consprocpaso.btn_nuevo']}" icon="pi pi-plus" actionListener="#{consultaProcedimientoPasoModels.btnNuevoHandler}" update=":frmFormulario @form"/>
                </p:toolbarGroup>
            </p:toolbar>
            <p:dataTable id="tablaRegistros" value="#{consultaProcedimientoPasoModels.registros}" var="r" emptyMessage="#{msg['global.msg_sin_registros']}" paginator="true" rows="10" style="margin-top: 10px;" selectionMode="single" selection="#{consultaProcedimientoPasoModels.registro}" rowKey="#{r.idConsultaProcedimientoPaso}">
                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>
                <p:ajax event="rowDblselect" listener="#{consultaProcedimientoPasoModels.btnSeleccionarRegistro(consultaProcedimientoPasoModels.registro.idConsultaProcedimientoPaso)}" update=":frmFormulario"/>
                <p:column headerText="#{msg['global.id']}">
                    <h:outputText value="#{r.idConsultaProcedimientoPaso}"/>
                </p:column>
                <p:column headerText="#{msg['global.col_paciente']}">
                    <h:outputText value="#{r.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.nombres} #{r.idConsultaProcedimiento.idConsulta.idPersonaRol.idPersona.apellidos}"/>
                </p:column>
                <p:column headerText="#{msg['consprocpaso.col_responsable']}">
                    <h:outputText value="#{r.idPersonaRol.idPersona.nombres} #{r.idPersonaRol.idPersona.apellidos}"/>
                </p:column>
                <p:column headerText="#{msg['global.estado']}">
                    <h:outputText value="#{r.estado}"/>
                </p:column>
                <p:column headerText="#{msg['global.col_fecha_inicio']}">
                    <h:outputText value="#{r.fechaInicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg['global.col_fecha_fin']}">
                    <h:outputText value="#{r.fechaFin}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                    </h:outputText>
                </p:column>
                <f:facet name="footer">
                    <p:commandButton id="btnModificar" value="#{msg['global.modificar']}" icon="pi pi-pencil" actionListener="#{consultaProcedimientoPasoModels.btnSeleccionarRegistro(consultaProcedimientoPasoModels.registro.idConsultaProcedimientoPaso)}" update=":frmFormulario" disabled="#{empty consultaProcedimientoPasoModels.registro.idConsultaProcedimientoPaso}" styleClass="ui-button-warning" style="margin-right: 5px;"/>
                    <p:commandButton id="btnEliminar" value="#{msg['global.eliminar']}" icon="pi pi-trash" actionListener="#{consultaProcedimientoPasoModels.btnEliminarHandler(consultaProcedimientoPasoModels.registro.idConsultaProcedimientoPaso)}" update=":mensajesGlobales:growl-sticky @form" disabled="#{empty consultaProcedimientoPasoModels.registro.idConsultaProcedimientoPaso}" styleClass="ui-button-danger">
                        <p:confirm header="#{msg['global.confirmacion']}" message="#{msg['global.msg_confirm_eliminar']}" icon="pi pi-info-circle"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="#{msg['global.no']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['global.si']}" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>
        <h:form id="frmFormulario">
            <p:panel header="#{consultaProcedimientoPasoModels.estado == 'CREAR' ? msg['global.nuevo_registro'] : msg['global.editar_registro']}" rendered="#{consultaProcedimientoPasoModels.estado != 'NINGUNO'}" style="margin-top: 20px;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="#{msg['global.lbl_id_autogenerado']}" rendered="#{consultaProcedimientoPasoModels.estado == 'CREAR'}"/>
                    <h:outputText value="#{consultaProcedimientoPasoModels.registro.idConsultaProcedimientoPaso}" rendered="#{consultaProcedimientoPasoModels.estado == 'CREAR'}"/>
                    <p:outputLabel for="cmbProcedimientoConsulta" value="#{msg['consprocpaso.lbl_procedimiento_consulta']}"/>
                    <p:selectOneMenu id="cmbProcedimientoConsulta" value="#{consultaProcedimientoPasoModels.registro.idConsultaProcedimiento}" converter="consultaProcedimientoConverter" required="true" requiredMessage="#{msg['consprocpaso.msg_req_procedimiento_consulta']}" filter="true" filterMatchMode="contains">
                        <f:selectItem itemLabel="#{msg['global.seleccione']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{consultaProcedimientoModels.registros}" var="cp" itemLabel="#{cp.idConsulta.idPersonaRol.idPersona.nombres} #{cp.idConsulta.idPersonaRol.idPersona.apellidos} - #{cp.idConsultaProcedimiento.toString().substring(0,8)}" itemValue="#{cp}"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="cmbPersonaRol" value="#{msg['consprocpaso.lbl_responsable']}"/>
                    <p:selectOneMenu id="cmbPersonaRol" value="#{consultaProcedimientoPasoModels.registro.idPersonaRol}" converter="personaRolConverter" required="true" requiredMessage="#{msg['consprocpaso.msg_req_responsable']}" filter="true" filterMatchMode="contains">
                        <f:selectItem itemLabel="#{msg['global.seleccione']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{personaRolModels.registros}" var="pr" itemLabel="#{pr.idPersona.nombres} #{pr.idPersona.apellidos} - #{pr.idRol.nombre}" itemValue="#{pr}"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="calFechaInicio" value="#{msg['global.lbl_fecha_inicio']}"/>
                    <p:datePicker id="calFechaInicio" value="#{consultaProcedimientoPasoModels.registro.fechaInicio}" showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"/>
                    <p:outputLabel for="calFechaFin" value="#{msg['global.lbl_fecha_fin']}"/>
                    <p:datePicker id="calFechaFin" value="#{consultaProcedimientoPasoModels.registro.fechaFin}" showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"/>
                    <p:outputLabel for="txtEstado" value="#{msg['consprocpaso.lbl_estado']}"/>
                    <p:inputText id="txtEstado" value="#{consultaProcedimientoPasoModels.registro.estado}" required="true" requiredMessage="#{msg['consprocpaso.msg_req_estado']}" maxlength="20"/>
                </h:panelGrid>
                <f:facet name="footer">
                    <crud:botonesCrud modelo="#{consultaProcedimientoPasoModels}" update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>
                </f:facet>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>>
