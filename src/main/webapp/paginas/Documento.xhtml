
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core" xmlns:crud="jakarta.faces.composite/crud" template="./general.xhtml">
    <ui:define name="titulo"> Gestión de Documentos </ui:define>
    <ui:define name="cuerpo">
        <h:form id="frmTabla">
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Nuevo Documento" icon="pi pi-plus" actionListener="#{documentoModels.btnNuevoHandler}" update=":frmFormulario @form"/>
                </p:toolbarGroup>
            </p:toolbar>
            <p:dataTable id="tablaRegistros" value="#{documentoModels.registros}" var="r" emptyMessage="No se encontraron registros" paginator="true" rows="10" style="margin-top: 10px;" selectionMode="single" selection="#{documentoModels.registro}" rowKey="#{r.idDocumento}">
                <p:ajax event="rowSelect" update="@form"/>
                <p:ajax event="rowUnselect" update="@form"/>
                <p:ajax event="rowDblselect" listener="#{documentoModels.btnSeleccionarRegistro(documentoModels.registro.idDocumento)}" update=":frmFormulario"/>
                <p:column headerText="ID">
                    <h:outputText value="#{r.idDocumento}"/>
                </p:column>
                <p:column headerText="Persona">
                    <h:outputText value="#{r.idPersona.nombres} #{r.idPersona.apellidos}"/>
                </p:column>
                <p:column headerText="Tipo de documento">
                    <h:outputText value="#{r.idTipoDocumento.nombre}"/>
                </p:column>
                <p:column headerText="Valor">
                    <h:outputText value="#{r.valor}"/>
                </p:column>
                <p:column headerText="Ruta física">
                    <h:outputText value="#{r.rutaFisica}"/>
                </p:column>
                <f:facet name="footer">
                    <p:commandButton id="btnModificar" value="Modificar" icon="pi pi-pencil" actionListener="#{documentoModels.btnSeleccionarRegistro(documentoModels.registro.idDocumento)}" update=":frmFormulario" disabled="#{empty documentoModels.registro.idDocumento}" styleClass="ui-button-warning" style="margin-right: 5px;"/>
                    <p:commandButton id="btnEliminar" value="Eliminar" icon="pi pi-trash" actionListener="#{documentoModels.btnEliminarHandler(documentoModels.registro.idDocumento)}" update=":mensajesGlobales:growl-sticky @form" disabled="#{empty documentoModels.registro.idDocumento}" styleClass="ui-button-danger">
                        <p:confirm header="Confirmación" message="¿Estás seguro de eliminar este registro?" icon="pi pi-info-circle"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>
        <h:form id="frmFormulario">
            <p:panel header="#{documentoModels.estado == 'CREAR' ? 'Nuevo Registro' : 'Editar Registro'}" rendered="#{documentoModels.estado != 'NINGUNO'}" style="margin-top: 20px;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="ID (Autogenerado):" rendered="#{documentoModels.estado == 'CREAR'}"/>
                    <h:outputText value="#{documentoModels.registro.idDocumento}" rendered="#{documentoModels.estado == 'CREAR'}"/>
                    <p:outputLabel for="cmbPersona" value="Persona:"/>
                    <p:selectOneMenu id="cmbPersona" value="#{documentoModels.registro.idPersona}" converter="personaConverter" required="true" requiredMessage="Seleccione la persona" filter="true" filterMatchMode="contains">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{personaModels.registros}" var="per" itemLabel="#{per.nombres} #{per.apellidos}" itemValue="#{per}"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="cmbTipoDocumento" value="Tipo de documento:"/>
                    <p:selectOneMenu id="cmbTipoDocumento" value="#{documentoModels.registro.idTipoDocumento}" converter="tipoDocumentoConverter" required="true" requiredMessage="Seleccione el tipo de documento" filter="true" filterMatchMode="contains">
                        <p:ajax event="change" update="txtIndicacionesTipo"/>
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{tipoDocumentoModels.registros}" var="td" itemLabel="#{td.nombre}" itemValue="#{td}"/>
                    </p:selectOneMenu>
                    <h:outputText value=""/>
                    <h:outputText id="txtIndicacionesTipo" value="#{documentoModels.registro.idTipoDocumento.indicaciones}" style="color: gray; font-size: 0.85em;"/>
                    <p:outputLabel for="txtValor" value="Valor:"/>
                    <p:inputText id="txtValor" value="#{documentoModels.registro.valor}" required="true" requiredMessage="El valor del documento es obligatorio"/>
                    <p:outputLabel for="txtRutaFisica" value="Ruta física:"/>
                    <p:inputText id="txtRutaFisica" value="#{documentoModels.registro.rutaFisica}"/>
                </h:panelGrid>
                <f:facet name="footer">
                    <crud:botonesCrud modelo="#{documentoModels}" update=":frmTabla :frmFormulario :mensajesGlobales:growl-sticky"/>
                </f:facet>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
